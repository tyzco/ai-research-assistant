services:
  app:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    volumes:
      - "./paper_cache:/app/paper_cache"
      - "./data:/app/data"
      - "${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
