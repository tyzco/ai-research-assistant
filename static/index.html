<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholar Bridge · 学术文献助手</title>
<style>
:root{--bg:#0d0d0d;--surface:#161616;--card:#1a1a1a;--text:#e0e0e0;--muted:#6b6b6b;--border:#292929;--brand:#5b6af0;--brand-dim:rgba(91,106,240,.12);--green:#4ca15c;--red:#d94f4f;--amber:#c98a26;--hover:#222;--input-bg:#111;--shadow:none;--radius:10px}
.light{--bg:#f2f2f2;--surface:#fafafa;--card:#fff;--text:#1a1a1a;--muted:#8c8c8c;--border:#e5e5e5;--brand:#4756d8;--brand-dim:rgba(71,86,216,.1);--green:#3a8540;--red:#c53030;--amber:#a66e1d;--hover:#f5f5f5;--input-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;letter-spacing:-.01em}
a{color:var(--brand);text-decoration:none}a:hover{opacity:.8}
/* Sidebar */
.sidebar{width:216px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;flex-shrink:0;z-index:10}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sidebar-header .logo{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
.sidebar-header .logo .mark{width:20px;height:20px;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.btn-new{width:100%;padding:7px 0;margin-top:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:11px;font-weight:500;cursor:pointer;transition:.12s;font-family:inherit}
.btn-new:hover{background:var(--hover);border-color:var(--brand)}
.topic-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.topic-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:.1s}
.topic-item:hover{background:var(--hover)}
.topic-item.active{background:var(--brand-dim)}
.topic-item .tname{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-item .tmeta{font-size:10px;color:var(--muted);margin-left:8px;white-space:nowrap}
.topic-item .tdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;opacity:0;transition:.1s}
.topic-item:hover .tdel{opacity:.5}
.topic-item .tdel:hover{opacity:1;color:var(--red)}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);line-height:1.6;text-align:center}
.sidebar-foot a{color:var(--muted)}
.sidebar-foot a:hover{color:var(--brand)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;max-height:100vh}
.topbar{padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;font-size:11px}
.topbar-title{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.topbar-status{font-size:10px;color:var(--muted)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-right button,.topbar-right label{font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.topbar-right label{display:flex;align-items:center;gap:4px;cursor:pointer}
.topbar-right input[type=checkbox]{accent-color:var(--brand)}
.chat{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
/* Messages */
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:in .25s ease-out both;max-width:760px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 16px;font-size:13px;line-height:1.5;max-width:85%}
.msg .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;font-size:13px;line-height:1.65}
.msg-actions{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.msg-actions button,.msg-actions a{padding:5px 12px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;font-family:inherit;transition:.1s}
.msg-actions button:hover,.msg-actions a:hover{border-color:var(--brand);color:var(--brand)}
/* Markdown */
.msg h1{font-size:16px;font-weight:700;margin-bottom:10px;letter-spacing:-.03em}
.msg h2{font-size:14px;font-weight:600;margin:12px 0 6px}
.msg h3{font-size:13px;font-weight:600;margin:8px 0 4px}
.msg pre{background:#000;color:#c0c0c0;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;overflow-x:auto;margin:8px 0;line-height:1.5}
.msg code{background:var(--hover);padding:2px 5px;border-radius:4px;font-size:12px}
.msg blockquote{border-left:2px solid var(--brand);margin:6px 0;padding:4px 14px;color:var(--muted);font-size:12px}
.msg ul,.msg ol{padding-left:22px;margin:4px 0}
/* Section labels */
.cn-header,.en-header{font-weight:600;font-size:11px;padding:8px 0 6px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.cn-header .badge,.en-header .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;color:var(--text)}
.cn-header .badge{background:rgba(217,79,79,.12)}.en-header .badge{background:rgba(91,106,240,.12)}
/* Paper row */
.paper{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:2px;border:1px solid transparent;transition:.1s}
.paper:hover{background:var(--hover);border-color:var(--border)}
.paper .chk{flex-shrink:0;margin-top:1px;accent-color:var(--brand)}
.paper .info{flex:1;min-width:0}
.paper .info .ptitle{font-size:12px;font-weight:500;margin-bottom:2px;line-height:1.45}
.paper .info .ptitle a{color:var(--text)}
.paper .info .ptitle a:hover{color:var(--brand)}
.paper .info .pmeta{font-size:10px;color:var(--muted);margin-bottom:5px}
.paper .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
/* Tags */
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500;text-decoration:none;border:1px solid var(--border);font-family:inherit;cursor:pointer;transition:.1s}
.tag:hover{opacity:.8}
.tag.green{border-color:rgba(76,161,92,.3);color:var(--green)}.tag.amber{border-color:rgba(201,138,38,.3);color:var(--amber)}
.tag.gray{border-color:var(--border);color:var(--muted);background:var(--card)}
.tag.purple{border-color:rgba(91,106,240,.3);color:var(--brand)}
.tag.bold{border-color:rgba(76,161,92,.5);background:rgba(76,161,92,.08);color:var(--green);font-weight:600}
/* Download guide */
.dl-guide{font-size:10px;color:var(--muted);background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:10px 14px;line-height:1.7}
.dl-guide b{color:var(--text)}
/* Skeleton */
.loading{padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.skeleton{background:var(--hover);animation:shimmer 1.5s infinite;border-radius:5px;height:12px;margin:4px 0}
.skeleton.w60{width:60%}.skeleton.w80{width:80%}.skeleton.w100{width:100%}
.loading .status{font-size:11px;font-weight:500;margin-bottom:8px;color:var(--muted)}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.8}}
/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px 24px;text-align:center;cursor:pointer;margin:0 16px 8px;transition:.15s}
.upload-zone:hover{border-color:var(--brand);background:var(--brand-dim)}
.upload-zone p{font-size:12px;color:var(--muted)}
/* Input */
.input-bar{padding:10px 18px 16px;display:flex;gap:10px}
.input-bar textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;resize:none;outline:none;font-family:inherit;line-height:1.45;max-height:120px;background:var(--input-bg);color:var(--text)}
.input-bar textarea:focus{border-color:var(--brand)}
.input-bar .send-btn{padding:10px 22px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit}
.input-bar .send-btn:hover{opacity:.9}.input-bar .send-btn:disabled{opacity:.35}
/* Progress */
.progress{position:fixed;bottom:24px;right:24px;z-index:100;width:280px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none}
.progress .bar{width:100%;height:6px;background:var(--hover);border-radius:3px;overflow:hidden;margin:10px 0}
.progress .fill{height:100%;background:var(--brand);border-radius:3px;transition:width .3s ease-out}
.progress .title{font-weight:600;font-size:11px;display:flex;justify-content:space-between}
.progress .detail{font-size:10px;color:var(--muted)}
/* Strategy */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.strat-card{background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.strat-card .db{font-size:10px;color:var(--muted);margin-bottom:4px}
.strat-card pre{font-size:11px;white-space:pre-wrap;color:var(--text);background:transparent;margin:0;padding:0;font-family:inherit}
/* Agent step */
.agent-step{padding:10px 14px;margin:4px 0;border-radius:8px;font-size:11px;border:1px solid var(--border);background:var(--hover);animation:in .25s ease-out}
.agent-step .label{font-weight:600;color:var(--brand);margin-bottom:4px}
.agent-step .detail{color:var(--muted);font-size:10px}
/* Preview panel */
#ppv{position:fixed;top:0;right:0;width:400px;height:100vh;background:var(--surface);border-left:1px solid var(--border);padding:20px;overflow-y:auto;z-index:50;box-shadow:-4px 0 24px rgba(0,0,0,.15)}
#ppv iframe{border:1px solid var(--border);border-radius:8px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo"><span class="mark">S</span>Scholar Bridge</div>
    <button class="btn-new" onclick="N()">New Search</button>
  </div>
  <nav class="topic-list" id="tl"></nav>
  <div class="sidebar-foot">
    <a href="/static/pipeline.html">Pipeline</a> &middot; <a href="/static/kg.html">Graph</a> &middot; <a href="/static/watch.html">Monitor</a><br>
    <span style="opacity:.5">research tool · v2</span>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <span class="topbar-title" id="ht">Scholar Bridge</span>
    <span class="topbar-status" id="st"></span>
    <div class="topbar-right">
      <button onclick="T()" title="Toggle theme">Dark</button>
      <label><input type="checkbox" id="agent-toggle" onchange="S.agent=this.checked;render()">Agent</label>
    </div>
  </div>
  <div class="chat" id="cc"></div>
  <div class="upload-zone" id="uz" style="display:none" onclick="document.getElementById('fi').click()" ondragover="event.preventDefault()" ondrop="H(event)">
    <input type="file" id="fi" accept=".pdf" multiple style="display:none" onchange="F(this.files)">
    <p>Drop PDFs here or click to upload</p>
  </div>
  <div class="input-bar">
    <textarea id="ui" rows="1" placeholder="Enter a research topic or question..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();X()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
    <button class="send-btn" onclick="X()">Send</button>
  </div>
</main>

<div class="progress" id="pg">
  <div class="title"><span>Building Knowledge Base</span><span id="pc" style="font-size:10px">0/0</span></div>
  <div class="bar"><div class="fill" id="pf" style="width:0%"></div></div>
  <div class="detail"><span id="pd">Preparing...</span></div>
</div>

<script>
const A='http://localhost:8001';
let S={ts:[],tid:null,q:'',msgs:[],strategy:null,pps:[],ppv:null,up:false,ld:false,ps:false,pg:0,pi:null,agent:false,agentSteps:[]};
(function I(){if(localStorage.aia_d==='0')document.documentElement.className='light';L();let s=localStorage.aia_t;if(s){var found=S.ts.find(function(x){return x.topic_id===s});if(found){try{W(s)}catch(e){localStorage.removeItem('aia_t');Y()}}else{Y()}}else Y()})();
function T(){let h=document.documentElement;h.className=h.className==='dark'?'light':'dark';localStorage.aia_d=h.className==='dark'?'0':'1'}
async function L(){try{S.ts=await(await fetch(A+'/topics')).json();K()}catch(e){}}
function Y(){S.msgs=[{r:'s',c:'# Scholar Bridge\n\nEnter a research topic to search across 12 academic databases. We will generate keywords, find papers, and build a knowledge base for deep Q&A.\n\nTry: **deep learning** &middot; **computer vision** &middot; **NLP**'}];R()}
function N(){clearInterval(S.pi);S.tid=null;S.q='';S.msgs=[];S.strategy=null;S.pps=[];S.up=false;S.ps=false;S.pg=0;localStorage.removeItem('aia_t');document.getElementById('uz').style.display='none';document.getElementById('pg').style.display='none';Y()}
async function W(id){S.tid=id;localStorage.aia_t=id;let t=S.ts.find(x=>x.topic_id===id);S.q=t?.q||'';if(!S.q){Y();return}S.msgs=[{r:'s',c:'Loading...'}];R();try{let r=await fetch(A+'/create_topic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:S.q})});let d=await r.json();S.strategy=d.strategy;S.msgs=[{r:'s',c:'# '+S.q+'\n\nStrategy loaded.'}];S.up=true;document.getElementById('uz').style.display='block';R();if(d.strategy.keywords_en&&d.strategy.keywords_en.length)SR(S.q,d.strategy.keywords_en,d.strategy.keywords_cn);S.ps=false;R()}catch(e){Ae('s','Error: '+e.message)}R()}
async function SR(q,ke,kc){
  S.pps=[];S.ps=true;R();
  try{
    let r=await fetch(A+'/search_papers/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,keywords_en:ke,keywords_cn:kc})});
    let reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){
      let{value,done}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      let lines=buf.split('\n');buf=lines.pop()||'';
      for(let l of lines){
        if(l.indexOf('data: ')!==0)continue;
        try{
          let d=JSON.parse(l.slice(6));
          if(d.event==='batch'){
            let seen=new Set(S.pps.map(function(x){return x.paper_id}));
            for(let i=0;i<(d.papers||[]).length;i++){
              let p=d.papers[i];
              if(!seen.has(p.paper_id)){seen.add(p.paper_id);S.pps.push(p)}
            }
            R()
          }else if(d.event==='done'){
            console.log('Search complete: '+d.total+' papers in '+d.elapsed)
          }
        }catch(e){}
      }
    }
    S.ps=false;R()
  }catch(e){console.log('Stream error: '+e.message);S.ps=false;R()}
}
async function X(){let el=document.getElementById('ui');let t=el.value.trim();if(!t||S.ld)return;el.value='';el.style.height='auto';if(S.agent){await AR(t);return}if(!S.tid){await C(t);return}Ae('user',t);if(S.up){if(t.includes('?')||t.includes('？'))await Q(t);else Ae('s','Please upload PDFs or use "Download & Build" first.');return}await Q(t)}
async function C(q){S.ld=true;R();try{let r=await fetch(A+'/create_topic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});let d=await r.json();S.tid=d.topic_id;S.q=q;S.strategy=d.strategy;S.msgs=[];localStorage.aia_t=d.topic_id;let c='# '+q+'\n\nStrategy ready &mdash; '+(d.strategy.keywords_cn||[]).slice(0,3).join(' &middot; ')+'\n\n### Next: upload PDFs or click "Download & Build"';Ae('s',c);S.up=true;document.getElementById('uz').style.display='block';S.ld=false;await L();S.ps=true;R();SR(q,d.strategy.keywords_en,d.strategy.keywords_cn);setTimeout(function(){if(S.tid===d.topic_id&&S.up)Ae('s','## How to use\n\n1. Click paper titles to preview\n2. Or click **Download & Build** to auto-download OA papers\n3. Drag PDFs to upload\n4. Ask questions once the KB is ready');},30000)}catch(e){Ae('s','Error: '+e.message);S.ld=false;R()}}
async function Q(q){S.ld=true;R();try{let r=await fetch(A+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:S.tid,question:q})});let d=await r.json();let c=d.answer||'';if(d.references&&d.references.length)c+='\n\n---\n**References**\n'+d.references.map(function(x){return'> '+x.title+' ('+(x.year||'')+')'}).join('\n');if(d.supplement&&d.supplement.length){c+='\n\n**Related**\n';d.supplement.forEach(function(s){c+='> **'+s.title+'** ('+(s.year||'')+')\n';if(s.doi_url)c+='> [DOI]('+s.doi_url+') ';if(s.cnki_url)c+='[CNKI]('+s.cnki_url+') ';if(s.google_scholar_url)c+='[GS]('+s.google_scholar_url+')\n'});}Ae('a',c)}catch(e){Ae('s','Error: '+e.message)}S.ld=false;R()}
function H(e){e.preventDefault();F(e.dataTransfer.files)}
async function F(files){if(!files.length||!S.tid)return;S.ld=true;R();let fd=new FormData();for(let f of files)fd.append('files',f);try{let r=await fetch(A+'/upload_pdf/'+S.tid,{method:'POST',body:fd});let d=await r.json();S.up=false;document.getElementById('uz').style.display='none';Ae('s','KB ready: '+d.papers+' papers, '+d.chunks+' chunks');await L()}catch(e){Ae('s','Upload failed: '+e.message)}S.ld=false;R()}
async function B(){let urls=S.pps.filter(function(p){return p.is_oa&&p.pdf_url}).map(function(p){return p.pdf_url});if(!urls.length)return alert('No OA papers to download');let pg=document.getElementById('pg');pg.style.display='block';document.getElementById('pc').textContent='0/'+urls.length;document.getElementById('pf').style.width='0%';clearInterval(S.pi);S.pi=setInterval(async function(){try{let r=await fetch(A+'/topic_status/'+S.tid);let d=await r.json();if(d.status==='ready'){clearInterval(S.pi);document.getElementById('pf').style.width='100%';document.getElementById('pc').textContent='done';document.getElementById('pd').textContent=d.progress;Ae('s','**KB ready!** '+d.progress+'\n\nYou can now ask questions.');S.up=false;document.getElementById('uz').style.display='none';await L();setTimeout(function(){pg.style.display='none'},3000)}else if(d.step){let pct=d.total?Math.round(d.current/d.total*100):0;document.getElementById('pf').style.width=pct+'%';document.getElementById('pc').textContent=(d.current||0)+'/'+(d.total||urls.length);document.getElementById('pd').textContent='Processing... CN '+(d.cn_papers||0)+' EN '+(d.en_papers||0)}}catch(e){}},1500);S.ld=true;R();try{let r=await fetch(A+'/download_bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:urls,topic_id:S.tid})});let blob=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='papers_'+S.tid+'.zip';a.click()}catch(e){clearInterval(S.pi);pg.style.display='none';alert('Download failed')}S.ld=false;R()}
async function AR(task){S.ld=true;S.agentSteps=[];render();try{let r=await fetch(A+'/agent/quick?v='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:task})});let d=await r.json();if(d.result){Ae('a',d.result)}else{Ae('s','Agent could not complete the task within limits.')}}catch(e){Ae('s','Agent execution failed: '+e.message)}S.ld=false;render()}
async function E(){if(!S.tid)return;let r=await fetch(A+'/export/'+S.tid);let blob=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='topic_'+S.tid+'.md';a.click()}
function CP(id){let el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.innerText)}
function Ae(r,c){S.msgs.push({r:r,c:c});R()}
function R(){
  var h='';S.msgs.forEach(function(m,i){
    h+='<div class="msg '+(m.r==='u'?'user':'')+'" style="animation-delay:'+(i*.03)+'s">';
    if(m.r==='u')h+='<div class="bubble">'+esc(m.c)+'</div>';
    else if(m.r==='a'){h+='<div class="card">'+md(m.c)+'<div class="msg-actions"><button onclick="CP(\'msg-'+i+'\')">Copy</button>';var p=S.msgs[i-1];if(p&&p.r==='u')h+='<button onclick="Q(\''+escA(p.c)+'\')">Regenerate</button>';h+='</div></div>';}
    else h+='<div class="card">'+md(m.c)+'</div>';
    h+='</div>';
  });
  if(S.ld)h+='<div class="loading"><div class="status">'+(S.agent?'Agent is thinking...':'Generating response...')+'</div><div class="skeleton w80"></div><div class="skeleton w100"></div><div class="skeleton w60"></div></div>';
  if(S.strategy&&S.strategy.boolean_queries&&S.strategy.boolean_queries.length){
    h+='<div class="card" style="animation-delay:.08s"><div style="font-weight:600;font-size:12px;margin-bottom:6px">Search Strategy</div>';
    h+='<div style="margin-bottom:6px">'+(S.strategy.keywords_cn||[]).map(function(k){return'<span class="tag">'+esc(k)+'</span>'}).join(' ')+'</div>';
    h+='<div class="strat-grid">';(S.strategy.boolean_queries||[]).slice(0,4).forEach(function(bq){h+='<div class="strat-card"><div class="db">'+esc(bq.database||'')+'</div><pre>'+esc(bq.query||'')+'</pre></div>'});h+='</div></div>';
  }
  if(S.agentSteps.length){h+='<div class="card" style="animation-delay:.05s"><div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--brand)">Agent Execution</div>';S.agentSteps.forEach(function(s,i){var icon=s.tool_result?'ok':'think';var label=s.tool_result?'Tool result':'Analysis';h+='<div class="agent-step" style="animation-delay:'+(i*.08)+'s"><div class="label">Step '+s.step+': '+label+'</div>';if(s.tool_result){try{var tr=JSON.parse(s.tool_result);if(tr.total)h+='<div class="detail">Found '+tr.total+' papers</div>';if(tr.best_kb)h+='<div class="detail">KB: '+tr.best_kb+'</div>';if(tr.answer)h+='<div class="detail">'+tr.answer.substring(0,100)+'...</div>'}catch(e){h+='<div class="detail">'+esc(String(s.tool_result).substring(0,120))+'</div>'}}else{h+='<div class="detail">'+esc(s.thought||'Analyzing...')+'</div>'}h+='</div>'});h+='</div>'}
  if(S.ps&&!S.pps.length){h+='<div class="loading" style="animation-delay:.15s"><div class="status">Searching across 12 databases...</div><div class="skeleton w80"></div><div class="skeleton w100"></div><div class="skeleton w60"></div></div>'}
  if(S.pps.length){
    var cn=S.pps.filter(function(p){return isCN(p.title)||(p.title||'').startsWith('[CNKI]')}),en=S.pps.filter(function(p){return!isCN(p.title)&&!(p.title||'').startsWith('[CNKI]')});
    var sh=Math.min((S.pg+1)*10,S.pps.length),oa=S.pps.filter(function(p){return p.is_oa&&p.pdf_url}).length;
    h+='<div class="card" style="animation-delay:.1s"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--muted);font-weight:500">'+S.pps.length+' papers ('+oa+' downloadable)</span><span style="display:flex;gap:6px"><button class="tag bold" onclick="B()">Download & Build</button><button class="tag gray" onclick="KGBatch()">Add to Graph</button><button class="tag amber" onclick="copyDOIs()">Copy DOIs</button></span></div>';
    h+='<div class="dl-guide"><b>Get PDFs:</b> Paste DOIs at <a href="https://sci-hub.se" target="_blank">Sci-Hub</a> &middot; <a href="https://sci-hub.st" target="_blank">Mirror 1</a> &middot; <a href="https://sci-hub.ru" target="_blank">Mirror 2</a> &middot; <a href="https://scholar.google.com" target="_blank">Google Scholar</a> &middot; university proxy &rarr; drag PDFs here to build KB + Graph</div>';
    if(cn.length){h+='<div class="cn-header">Chinese <span class="badge">'+cn.length+'</span></div>';cn.slice(0,Math.min(sh,cn.length)).forEach(function(p){h+=PR(p)})}
    if(en.length){var se=Math.max(0,sh-(cn.length?Math.min(sh,cn.length):0));h+='<div class="en-header">English <span class="badge">'+en.length+'</span></div>';en.slice(0,se).forEach(function(p){h+=PR(p)})}
    if(S.pps.length>sh)h+='<div style="text-align:center;margin-top:6px"><button class="tag gray" onclick="S.pg++;R()">Load more ('+(S.pps.length-sh)+' remaining)</button></div>';
    h+='</div>';
  }
  document.getElementById('cc').innerHTML=h;
  if(S.ppv){var p=S.ppv;var pv=document.createElement('div');pv.id='ppv';pv.innerHTML='<button onclick="var x=document.getElementById(\'ppv\');if(x)x.remove();S.ppv=null" style="float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">&times;</button><h3 style="font-size:14px;color:var(--text);margin:0 0 6px;font-weight:600">'+esc(p.title||'')+'</h3><p style="font-size:10px;color:var(--muted);margin:0 0 10px">'+esc(p.authors||'?')+' &middot; '+(p.year||'?')+' &middot; '+(p.is_oa?'OA':'Subscription')+'</p><div style="font-size:11px;color:var(--muted);line-height:1.6;max-height:240px;overflow-y:auto;border-top:1px solid var(--border);padding-top:10px;margin-bottom:10px"><b>Abstract</b><br>'+esc((p.abstract||'Not available').substring(0,1200))+'</div>'+(p.pdf_url?'<iframe src="'+esc(p.pdf_url)+'#view=FitH" width="100%" height="360" style="border:none;border-radius:8px;margin:8px 0"></iframe>':'')+'<div style="display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px">'+(p.doi?'<a href="https://doi.org/'+p.doi+'" target="_blank" class="tag gray">DOI</a>':'')+(p.cnki_url?'<a href="'+esc(p.cnki_url)+'" target="_blank" class="tag gray">CNKI</a>':'')+(p.pdf_url?'<a href="'+esc(p.pdf_url)+'" download class="tag green">Download PDF</a>':'')+'<button class="tag gray" onclick="KGadd()">Add to Graph</button></div>';document.getElementById('cc').appendChild(pv)}
  document.getElementById('ht').textContent=S.q||'Scholar Bridge';
  document.getElementById('st').textContent=S.ld?'working...':(S.ps?'searching...':(S.up?'ready':(S.pps.length?S.pps.length+' papers':'')));
  document.getElementById('cc').scrollTop=document.getElementById('cc').scrollHeight;
}
function PR(p){var dl_url=p.download_url||p.pdf_url,prv_url=p.preview_url||p.doi_url||p.cnki_url||'#';return'<div class="paper"><input type="checkbox" class="chk" id="chk_'+escA(p.paper_id)+'" title="Select for graph"><div class="info"><div class="ptitle"><a href="javascript:void(0)" onclick="PV(\''+escA(p.paper_id)+'\')" title="Preview">'+esc(p.title)+'</a></div><div class="pmeta">'+esc(p.authors||'')+' &middot; '+(p.year||'')+' &middot; '+esc(p.source||'')+'</div><div class="tags">'+(dl_url?'<a href="'+esc(dl_url)+'" download class="tag green">Download</a>':'<span class="tag">Subscription</span>')+(prv_url&&prv_url!=='#'?'<a href="'+esc(prv_url)+'" target="_blank" class="tag purple">Online</a>':'')+(p.cnki_url?'<a href="'+esc(p.cnki_url)+'" target="_blank" class="tag">CNKI</a>':'')+(p.google_scholar_url?'<a href="'+esc(p.google_scholar_url)+'" target="_blank" class="tag">GS</a>':'')+(p.doi_url?'<a href="'+esc(p.doi_url)+'" target="_blank" class="tag gray">DOI</a>':'')+'<span class="tag gray" style="cursor:pointer" onclick="PV(\''+escA(p.paper_id)+'\')">Preview</span><span class="tag gray" style="cursor:pointer" onclick="navigator.clipboard.writeText(\''+escA(p.title)+'\')">Copy</span></div></div></div>'}
function PV(pid){var p=S.pps.find(function(x){return x.paper_id===pid});if(!p)return;S.ppv=p;buildPreview(p)}
function buildPreview(p){var old=document.getElementById('ppv');if(old)old.remove();S.ppv=p;R()}
async function KGadd(){var p=S.ppv;if(!p)return;try{await fetch(A+'/kg/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:p.paper_id})});window.open('/static/kg.html','_blank')}catch(e){}}
async function KGBatch(){var ids=[];S.pps.forEach(function(p){var el=document.getElementById('chk_'+escA(p.paper_id));if(el&&el.checked)ids.push(p.paper_id)});if(!ids.length)return alert('Select papers first');try{await fetch(A+'/kg/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:ids.join(',')})});window.open('/static/kg.html','_blank')}catch(e){}}
async function copyDOIs(){var dois=S.pps.filter(function(p){return p.doi}).map(function(p){return p.doi});if(!dois.length)return alert('No DOIs available');navigator.clipboard.writeText(dois.join('\n'));alert('Copied '+dois.length+' DOIs.\nPaste at Sci-Hub to batch download.')}
async function D(id){if(!confirm('Delete this topic?'))return;try{await fetch(A+'/topic/'+id,{method:'DELETE'});S.ts=S.ts.filter(function(t){return t.topic_id!==id});if(S.tid===id)N();K()}catch(e){}}
function K(){var el=document.getElementById('tl');if(!S.ts.length){el.innerHTML='<div style="text-align:center;color:var(--muted);font-size:10px;padding:16px">No saved topics</div>';return}var h='';for(var i=0;i<S.ts.length;i++){var t=S.ts[i];var st=(t.status==='ready'||t.papers>0)?(t.papers||'')+' papers':'new';h+='<div class="topic-item'+(t.topic_id===S.tid?' active':'')+'"><div onclick="W(\''+t.topic_id+'\')" style="flex:1;cursor:pointer;display:flex;flex-direction:column;min-width:0"><div class="tname">'+esc(t.query||'Untitled')+'</div><div class="tmeta">'+st+'</div></div><button class="tdel" onclick="event.stopPropagation();D(\''+t.topic_id+'\')" title="Delete">&times;</button></div>'}el.innerHTML=h}
function md(t){if(!t)return'';var h=esc(t);h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return'<p>'+h+'</p>'}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escA(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}
function isCN(t){t=t||'';for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);if(c>=19968&&c<=40869)return true}return false}
</script>
