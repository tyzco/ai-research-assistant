<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperLink &mdash; 直达论文</title>
<style>
:root,.light{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--brand:#2563eb;--brand-light:#3b82f6;--green:#16a34a;--hover:#f1f5f9;--input-bg:#fff;--shadow:0 1px 3px rgba(0,0,0,.04);--red:#dc2626}
.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--brand:#3b82f6;--brand-light:#60a5fa;--green:#22c55e;--hover:#334155;--input-bg:#1e293b;--shadow:0 1px 3px rgba(0,0,0,.2);--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
/* Glow */
.glow{position:fixed;top:-256px;left:0;right:0;height:512px;background:radial-gradient(ellipse at 50% 0,rgba(37,99,235,.08) 0,transparent 70%);pointer-events:none;z-index:0}
/* Sidebar */
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10;flex-shrink:0}
.sidebar h2{font-size:13px;font-weight:600;padding:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sidebar h2 i{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}
.sidebar .btn-new{width:100%;padding:7px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:500;cursor:pointer;margin:8px 0}
.sidebar .btn-new:hover{background:var(--brand-light)}
.topic-list{flex:1;overflow-y:auto;padding:4px}
.topic-item{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:11px;margin:2px 4px;border-left:2px solid transparent;transition:.15s}
.topic-item:hover{background:var(--hover)}
.topic-item.active{background:color-mix(in srgb,var(--brand) 8%,transparent);border-left-color:var(--brand)}
.topic-item .tname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-item .tmeta{font-size:10px;color:var(--muted)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;max-height:100vh}
.topbar{padding:6px 14px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:11px}
.topbar select,.topbar button{font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}
.topbar .sep{color:var(--muted);font-size:10px}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
/* Messages */
@keyframes popIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:popIn .3s ease-out both}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{max-width:80%;background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13px;line-height:1.5;box-shadow:0 2px 6px rgba(37,99,235,.12)}
.msg .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}
/* ----- ACTION BUTTONS: 醒目、灰底、蓝字、大号 ----- */
.msg-actions{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.msg-actions button,.msg-actions a{display:inline-flex!important;align-items:center;gap:5px;padding:7px 16px;font-size:13px;font-weight:600;background:var(--hover);border:2px solid #94a3b8;border-radius:10px;color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none;line-height:1.2}
.msg-actions button:hover,.msg-actions a:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
/* Markdown */
.msg h1{font-size:15px;font-weight:700;margin-bottom:6px}
.msg h2{font-size:14px;font-weight:600;margin:8px 0 4px}
.msg h3{font-size:13px;font-weight:600;margin:6px 0 2px}
.msg pre{background:#1e293b;color:#e2e8f0;border-radius:8px;padding:10px 14px;font-size:12px;overflow-x:auto;margin:6px 0}
.msg code{background:var(--hover);padding:2px 5px;border-radius:4px;font-size:12px;color:var(--brand)}
.msg blockquote{border-left:3px solid #a5b4fc;margin:6px 0;padding:4px 12px;color:var(--muted);font-size:12px;background:var(--hover);border-radius:0 6px 6px 0}
.msg a{color:var(--brand)}
.msg a:hover{text-decoration:underline}
.msg ul,.msg ol{padding-left:20px;margin:4px 0}
/* Section titles */
.cn-header,.en-header{font-weight:700;font-size:12px;padding:6px 0;margin:6px 0 4px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.cn-header{color:var(--red)}
.en-header{color:var(--brand)}
.cn-header .badge,.en-header .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.cn-header .badge{background:#fee2e2;color:var(--red)}.dark .cn-header .badge{background:#7f1d1d;color:#fca5a5}
.en-header .badge{background:#dbeafe;color:var(--brand)}.dark .en-header .badge{background:#1e3a5f;color:#93c5fd}
/* Paper card */
.paper{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:3px;background:var(--card);border:1px solid var(--border);transition:all .15s}
.paper:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.paper .icon{font-size:16px;flex-shrink:0;margin-top:2px}
.paper .info{flex:1;min-width:0}
.paper .info .ptitle{font-size:12px;font-weight:500;margin-bottom:3px;line-height:1.4}
.paper .info .ptitle a{color:var(--text);text-decoration:none}
.paper .info .ptitle a:hover{color:var(--brand)}
.paper .info .pmeta{font-size:10px;color:var(--muted);margin-bottom:4px}
.paper .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:500;text-decoration:none}
.tag.green{background:#dcfce7;color:#166534}.dark .tag.green{background:#14532d;color:#86efac}
.tag.yellow{background:#fef9c3;color:#854d0e}.dark .tag.yellow{background:#713f12;color:#fde047}
.tag.red{background:#fee2e2;color:#991b1b}
.tag.blue{background:#dbeafe;color:#1e40af}
.tag.gray{background:var(--hover);color:var(--muted);cursor:pointer}
.tag.gray:hover{background:var(--border)}
.tag.purple{background:#f0e6ff;color:#7c3aed;text-decoration:none}.dark .tag.purple{background:#2d1b69;color:#a78bfa}
/* Progress bar */
.progress{position:fixed;bottom:20px;right:20px;z-index:100;width:300px;background:var(--card);border:2px solid var(--brand);border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);display:none}
.progress .bar{width:100%;height:8px;background:var(--hover);border-radius:4px;overflow:hidden;margin:10px 0}
.progress .fill{height:100%;background:linear-gradient(90deg,var(--brand),#7c3aed);border-radius:4px;transition:width .4s ease-out;animation:shimmer 2s infinite}
@keyframes shimmer{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}
.progress .title{font-weight:600;font-size:12px;color:var(--brand);display:flex;justify-content:space-between}
.progress .detail{font-size:10px;color:var(--muted);margin-top:4px}
/* Loading */
.loading{padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.skeleton{background:linear-gradient(90deg,var(--hover) 25%,var(--border) 50%,var(--hover) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:14px;margin:5px 0}
.skeleton.w60{width:60%}.skeleton.w80{width:80%}.skeleton.w90{width:90%}.skeleton.w100{width:100%}
.skeleton.title{height:18px;width:45%;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading .status{font-size:12px;font-weight:600;color:var(--brand);margin-bottom:6px}
/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:24px;text-align:center;cursor:pointer;margin:0 14px 8px;transition:.15s}
.upload-zone:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 3%,transparent)}
/* Input */
.input-bar{padding:8px 14px 14px;display:flex;gap:8px}
.input-bar textarea{flex:1;border:1px solid var(--border);border-radius:14px;padding:10px 14px;font-size:13px;resize:none;outline:none;font-family:inherit;line-height:1.4;max-height:120px;background:var(--input-bg);color:var(--text);box-shadow:var(--shadow)}
.input-bar textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.input-bar .send-btn{padding:10px 20px;background:var(--brand);color:#fff;border:none;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.input-bar .send-btn:hover{box-shadow:0 4px 12px rgba(37,99,235,.3);transform:translateY(-1px)}
.input-bar .send-btn:disabled{opacity:.5}
/* Shimmer 文字动画 */
.shimmer-text{display:inline-block;background:linear-gradient(90deg,#64748b 25%,#3b82f6 50%,#64748b 75%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer-text 2s linear infinite}
@keyframes shimmer-text{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Agent step card */
.agent-step{padding:10px 14px;margin:4px 0;border-radius:10px;font-size:11px;border-left:3px solid var(--brand);background:var(--hover);animation:popIn .3s ease-out}
.agent-step .label{font-weight:600;color:var(--brand);margin-bottom:4px}
.agent-step .detail{color:var(--muted);font-size:10px}

/* Strategy cards */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.strat-card{background:var(--hover);border-radius:10px;padding:10px 12px}
.strat-card .db{font-size:10px;color:var(--muted);margin-bottom:4px}
.strat-card pre{font-size:11px;white-space:pre-wrap;color:var(--text);background:transparent;margin:0;padding:0}
/* Footnote */
.footnote{font-size:9px;color:var(--muted);text-align:center;padding:8px;border-top:1px solid var(--border);margin-top:auto}
.footnote a{color:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1.5s ease-in-out infinite;vertical-align:middle;margin-right:4px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.dots-bar{display:flex;gap:3px;margin:4px 0 8px;flex-wrap:wrap}
.dots-bar i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .3s}
.dots-bar i.on{background:var(--brand);box-shadow:0 0 4px var(--brand-light)}
.topbar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.topbar .dot.live{background:var(--green);animation:dotLive 2s ease-in-out infinite}
.topbar .dot.idle{background:var(--muted)}
@keyframes dotLive{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.4)}50%{box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.count-pop{animation:countPop .35s ease-out}
@keyframes countPop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="glow"></div>
<div id="fbar" style="position:fixed;top:0;left:0;right:0;height:2px;z-index:200;display:none;background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:60px 100%;animation:shimmer 1s linear infinite"></div>

<aside class="sidebar">
  <h2><i>P</i>PaperLink</h2>
  <div style="padding:0 10px"><button class="btn-new" onclick="N()">+ 新建课题</button></div>
  <nav class="topic-list" id="tl"></nav>
  <div class="footnote">
    本平台仅提供论文元数据索引<br>不存储或分发受版权保护的论文全文
    <br><br><a href="/static/pipeline.html" style="color:var(--muted)">🔬 流水线</a> · <a href="/static/kg.html" style="color:var(--muted)">📊 图谱</a> · <a href="/static/watch.html" style="color:var(--muted)">👁️ 监控</a>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <span style="font-weight:600" id="ht">PaperLink</span>
    <span style="font-size:10px;color:var(--muted)" id="st"></span><span class="dot live" id="ldot" style="display:none"></span>
    <span style="margin-left:auto"></span>
    <button onclick="T()" title="暗色模式">🌓</button>
    <span style="font-size:10px;color:var(--muted)">|</span>
    <label style="font-size:10px;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="agent-toggle" onchange="S.agent=this.checked;render()" style="cursor:pointer">
      🤖 Agent
    </label>
  </div>
  <div class="chat" id="cc"></div>
  <div class="upload-zone" id="uz" style="display:none" onclick="document.getElementById('fi').click()" ondragover="event.preventDefault()" ondrop="H(event)">
    <input type="file" id="fi" accept=".pdf" multiple style="display:none" onchange="F(this.files)">
    <div style="font-size:28px;margin-bottom:6px">📤</div>
    <p style="font-size:13px;color:var(--muted)">拖拽或点击上传 PDF 论文</p>
  </div>
  <div class="input-bar">
    <textarea id="ui" rows="1" placeholder="输入研究方向或提问…" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();X()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" oncompositionstart="this.dataset.composing='1'" oncompositionend="this.dataset.composing='0'"></textarea>
    <button class="send-btn" onclick="X()">发送</button>
  </div>
</main>

<div class="progress" id="pg">
  <div class="title"><span>📥 构建知识库</span><span id="pc" style="font-size:10px">0/0</span></div>
  <div class="bar"><div class="fill" id="pf" style="width:0%"></div></div>
  <div class="detail"><span id="pd">准备中…</span></div>
</div>

<script>
const A='http://localhost:8001';
let S={ts:[],tid:null,q:'',msgs:[],strategy:null,pps:[],ppv:null,phase:'welcome',pg:0,pi:null,agent:false,agentSteps:[]};
var PHASES={welcome:'等待输入',strategy:'策略就绪',searching:'搜索中',papers_loaded:'论文已加载',building:'构建知识库',ready:'可以提问',thinking:'生成中'};
function setPhase(p){var prev=S.phase;S.phase=p;console.log('Phase: '+prev+' → '+p);R()}
async function loadTopics(){await L();var s=localStorage.aia_t;if(s){var found=S.ts.find(function(x){return x.topic_id===s});if(found){W(s).catch(function(){localStorage.removeItem('aia_t');Y()})}else{localStorage.removeItem('aia_t');Y()}}else Y()}
(function I(){if(localStorage.aia_d==='1')document.documentElement.className='dark';loadTopics()})();
function T(){let h=document.documentElement;h.className=h.className==='dark'?'light':'dark';localStorage.aia_d=h.className==='dark'?'1':'0'}
async function L(){try{S.ts=await(await fetch(A+'/topics')).json();K()}catch(e){setTimeout(L,3000)}}
function Y(){S.msgs=[{r:'s',c:'# PaperLink\n\n输入研究方向 / 提问 / 上传论文\n\n搜索 12 个学术数据库 · 自动构建知识库 · 深度问答'}];R()}
function N(){clearInterval(S.pi);S.tid=null;S.q='';S.msgs=[];S.strategy=null;S.pps=[];S.pg=0;setPhase('welcome');localStorage.removeItem('aia_t');document.getElementById('uz').style.display='none';document.getElementById('pg').style.display='none';Y()}
async function W(id){S.tid=id;localStorage.aia_t=id;S._resetScroll=true;S._autoScroll=false;var t=S.ts.find(function(x){return x.topic_id===id});S.q=t?t.query||'':'';if(!S.q){Y();return}S.msgs=[{r:'s',c:'# '+S.q+'\n\n加载中…'}];setPhase('strategy');R();try{var r=await fetch(A+'/create_topic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:S.q,topic_id:id})});var d=await r.json();S.strategy=d.strategy;var sc='# '+S.q+'\n\n检索策略: '+(d.strategy.keywords_cn||[]).slice(0,4).join(' · ')+'\n\n输入问题开始问答，或拖拽论文PDF上传';S.msgs=[{r:'s',c:sc}];document.getElementById('uz').style.display='block';R();L()}catch(e){S.msgs=[{r:'s',c:'# '+S.q+'\n\n加载失败: '+e.message}];R()}}
async function SR(q,ke,kc){
  S.pps=[];setPhase('searching');document.getElementById('ldot').style.display='inline-block';document.getElementById('fbar').style.display='block';document.getElementById('ldot').className='dot live';R();
  try{
    let r=await fetch(A+'/search_papers/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,keywords_en:ke,keywords_cn:kc})});
    let reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    while(true){
      let{value,done}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      let lines=buf.split('\n');buf=lines.pop()||'';
      for(let l of lines){
        if(l.indexOf('data: ')!==0)continue;
        try{
          let d=JSON.parse(l.slice(6));
          if(d.event==='batch'){
            let seen=new Set(S.pps.map(function(x){return x.paper_id}));
            for(let i=0;i<(d.papers||[]).length;i++){
              let p=d.papers[i];
              if(!seen.has(p.paper_id)){seen.add(p.paper_id);S.pps.push(p)}
            }
            R()
          }else if(d.event==='done'){
            console.log('Search done: '+d.total+' papers in '+d.elapsed);var db=document.querySelectorAll('.dots-bar i');for(var j=0;j<db.length&&j<12;j++)db[j].className='on'
          }
        }catch(e){}
      }
    }
    setPhase('papers_loaded');R()
  }catch(e){console.log('stream search failed: '+e.message);setPhase('strategy');document.getElementById('ldot').className='dot idle';document.getElementById('fbar').style.display='none';R()}
}async function X(){let el=document.getElementById('ui');let t=el.value.trim();if(!t||S.phase==='thinking'||S.phase==='building')return;el.value='';el.style.height='auto';S._resetScroll=true;S._autoScroll=true;if(S.agent){await AR(t);return}if(!S.tid){await C(t);return}Ae('user',t);await Q(t)}
async function C(q){S._resetScroll=true;S._autoScroll=false;setPhase('thinking');try{let r=await fetch(A+'/create_topic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});let d=await r.json();S.tid=d.topic_id;S.q=q;S.strategy=d.strategy;S.msgs=[];localStorage.aia_t=d.topic_id;let c='# '+q+'\n\n✅ 检索策略已生成 — '+(d.strategy.keywords_cn||[]).slice(0,3).join(' · ')+'\n\n### 📤 下一步：上传 PDF 或点"一键下载并构建"';Ae('s',c);setPhase('strategy');document.getElementById('uz').style.display='block';await L();SR(q,d.strategy.keywords_en,d.strategy.keywords_cn);setTimeout(function(){if(S.tid===d.topic_id&&S.phase==='papers_loaded')Ae('s','## 📚 如何使用\n\n1. 点击论文标题跳转下载 PDF\n2. 或点 **⬇📥 一键下载并构建**\n3. 拖拽 PDF 到页面上传\n4. 建库完成后即可提问')},30000)}catch(e){Ae('s','❌ '+e.message);setPhase('papers_loaded');R()}}
async function Q(q){setPhase('thinking');try{let r=await fetch(A+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic_id:S.tid,question:q})});let ct=r.headers.get('content-type')||'';if(ct.indexOf('text/event-stream')>=0){let reader=r.body.getReader(),decoder=new TextDecoder(),buf='',answer='';while(true){let{value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';for(let l of lines){if(l.indexOf('data: ')===0){try{let d=JSON.parse(l.slice(6));if(d.token)answer+=d.token;if(d.done)R()}catch(e){}}}R()}if(answer){let refs='';Ae('a',answer)}else{Ae('s','生成失败')}}else{let d=await r.json();let c=d.answer||'';if(d.references&&d.references.length)c+='\n\n---\n**📖 引用文献**\n'+d.references.map(x=>'> '+x.title+' ('+(x.year||'')+')').join('\n');if(d.supplement&&d.supplement.length){c+='\n\n**🔎 建议补充**\n';d.supplement.forEach(s=>{c+='> **'+s.title+'** ('+(s.year||'')+')\n';if(s.doi_url)c+='> [📄 DOI]('+s.doi_url+') ';if(s.cnki_url)c+='[📚 知网]('+s.cnki_url+') ';if(s.google_scholar_url)c+='[🔍 谷歌学术]('+s.google_scholar_url+')\n';});}Ae('a',c)}}catch(e){Ae('s','❌ 提问失败: '+e.message)}setPhase('papers_loaded');R()}
function H(e){e.preventDefault();F(e.dataTransfer.files)}
async function F(files){if(!files.length||!S.tid)return;setPhase('thinking');let fd=new FormData();for(let f of files)fd.append('files',f);try{let r=await fetch(A+'/upload_pdf/'+S.tid,{method:'POST',body:fd});let d=await r.json();setPhase('ready');document.getElementById('uz').style.display='none';Ae('s','✅ 知识库就绪！'+d.papers+'篇, '+d.chunks+'个文本块');await L()}catch(e){Ae('s','❌ '+e.message)}setPhase('papers_loaded');R()}
async function B(){let urls=S.pps.filter(p=>p.is_oa&&p.pdf_url).map(p=>p.pdf_url);if(!urls.length)return alert('没有可下载的 OA 论文');let pg=document.getElementById('pg');pg.style.display='block';document.getElementById('pc').textContent='0/'+urls.length;document.getElementById('pf').style.width='0%';clearInterval(S.pi);S.pi=setInterval(async()=>{try{let r=await fetch(A+'/topic_status/'+S.tid);let d=await r.json();if(d.status==='ready'){clearInterval(S.pi);document.getElementById('pf').style.width='100%';document.getElementById('pc').textContent='✅';document.getElementById('pd').textContent=d.progress;Ae('s','✅ **知识库就绪！**\n\n'+d.progress+'\n\n现在可以提问了！');setPhase('ready');document.getElementById('uz').style.display='none';await L();setTimeout(()=>pg.style.display='none',3000)}else if(d.step){let pct=d.total?Math.round(d.current/d.total*100):0;document.getElementById('pf').style.width=pct+'%';document.getElementById('pc').textContent=(d.current||0)+'/'+(d.total||urls.length);document.getElementById('pd').textContent='处理中… 🇨🇳'+(d.cn_papers||0)+' 🌐'+(d.en_papers||0)}}catch(e){}},1500);setPhase('thinking');try{let r=await fetch(A+'/download_bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls,topic_id:S.tid})});let blob=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='papers_'+S.tid+'.zip';a.click()}catch(e){clearInterval(S.pi);pg.style.display='none';alert('下载失败')}setPhase('papers_loaded');R()}
async function AR(task){setPhase('thinking');S.agentSteps=[];render();try{let r=await fetch(A+'/agent/quick?v='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:task})});let d=await r.json();if(d.result){Ae('a',d.result)}else{Ae('s','❌ Agent 未能在限制步数内完成任务。')}}catch(e){Ae('s','❌ Agent 执行失败: '+e.message)}setPhase('ready');render()}
async function E(){if(!S.tid)return;let r=await fetch(A+'/export/'+S.tid);let blob=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='topic_'+S.tid+'.md';a.click()}
function CP(id){let el=document.getElementById(id);if(!el)return;navigator.clipboard.writeText(el.innerText);let btn=document.querySelector('[data-cp="'+id+'"]');if(btn){btn.innerHTML='✅ 已复制';setTimeout(()=>btn.innerHTML='📋 复制',1500)}}
function Ae(r,c){S.msgs.push({r,c});R()}
function R(){
  let h='';S.msgs.forEach((m,i)=>{
    h+='<div class="msg '+(m.r==='u'?'user':'')+'" style="animation-delay:'+(i*.04)+'s">';
    if(m.r==='u')h+='<div class="bubble">'+esc(m.c)+'</div>';
    else if(m.r==='a'){h+='<div class="card">'+md(m.c)+'<div class="msg-actions"><button data-cp="msg-'+i+'" onclick="CP(\'msg-'+i+'\')">📋 复制</button>';let p=S.msgs[i-1];if(p&&p.r==='u')h+='<button onclick="Q(\''+escA(p.c)+'\')">🔄 重新生成</button>';h+='</div></div>';}
    else h+='<div class="card">'+md(m.c)+'</div>';
    h+='</div>';
  });
  if(S.phase==='thinking')h+='<div class="loading"><div class="status"><span class="pulse"></span> '+(S.agent?'Agent 思考中…':'生成回答中…')+'</div><div class="skeleton w80"></div><div class="skeleton w100"></div><div class="skeleton w60"></div></div>';
  if(S.strategy&&S.strategy.boolean_queries?.length){
    h+='<div class="msg card" style="animation-delay:.1s"><div style="font-weight:600;font-size:12px;margin-bottom:6px">🔍 检索策略</div>';
    h+='<div style="margin-bottom:6px">'+(S.strategy.keywords_cn||[]).map(k=>'<span class="tag blue">'+esc(k)+'</span>').join(' ')+'</div>';
    h+='<div class="strat-grid">';(S.strategy.boolean_queries||[]).slice(0,4).forEach(bq=>{h+='<div class="strat-card"><div class="db">'+esc(bq.database||'')+'</div><pre>'+esc(bq.query||'')+'</pre></div>';});h+='</div></div>';
  }
  if(S.agentSteps.length){h+='<div class="msg card" style="animation-delay:.05s"><div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--brand)">🤖 Agent 执行过程</div>';S.agentSteps.forEach((s,i)=>{let icon=s.tool_result?'✅':'🧠';let label=s.tool_result?'工具返回':'思考分析';let cls=s.tool_result?'':'shimmer-text';h+='<div class="agent-step" style="animation-delay:'+(i*.1)+'s"><div class="label">'+icon+' Step '+s.step+': '+label+'</div>';if(s.tool_result){try{let tr=JSON.parse(s.tool_result);if(tr.total)h+='<div class="detail">📄 搜索到 '+tr.total+' 篇论文</div>';if(tr.best_kb)h+='<div class="detail">📚 推荐知识库: '+tr.best_kb+'</div>';if(tr.answer)h+='<div class="detail">💬 '+tr.answer.substring(0,100)+'...</div>'}catch(e){h+='<div class="detail">'+esc(String(s.tool_result).substring(0,120))+'</div>'}}else{h+='<div class="detail '+cls+'">'+esc(s.thought||'分析中…')+'</div>'}h+='</div>'});h+='</div>'}if(S.phase==='searching'&&!S.pps.length){h+='<div class="loading" style="animation-delay:.2s"><div class="status">🔍 正在多源搜索论文…</div><div class="skeleton w80"></div><div class="skeleton w100"></div><div class="skeleton w60"></div></div>'}
  if(S.pps.length){
    let cn=S.pps.filter(p=>isCN(p.title)||(p.title||'').startsWith('[知网]')),en=S.pps.filter(p=>!isCN(p.title)&&!(p.title||'').startsWith('[知网]'));
    let sh=Math.min((S.pg+1)*10,S.pps.length),oa=S.pps.filter(p=>p.is_oa&&p.pdf_url).length;
    h+='<div class="msg card" style="animation-delay:.15s"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--muted);font-weight:600">📄 <span class="count-pop" style="display:inline-block">'+S.pps.length+'</span>篇, '+oa+'可下载</span><span style="display:flex;gap:6px"><button class="tag green" style="cursor:pointer;font-size:11px;padding:5px 10px" onclick="B()">⬇📥 一键下载并构建</button><button class="tag gray" style="cursor:pointer;font-size:11px;padding:5px 10px" onclick="KGBatch()">📊 加入图谱</button></span></div>';
    if(cn.length){h+='<div class="cn-header">🇨🇳 中文论文 <span class="badge">'+cn.length+'篇</span></div>';cn.slice(0,Math.min(sh,cn.length)).forEach(p=>h+=PR(p));}
    if(en.length){let se=Math.max(0,sh-(cn.length?Math.min(sh,cn.length):0));h+='<div class="en-header">🌐 英文论文 <span class="badge">'+en.length+'篇</span></div>';en.slice(0,se).forEach(p=>h+=PR(p));}
    if(S.pps.length>sh)h+='<div style="text-align:center;margin-top:6px"><button class="tag gray" onclick="S.pg++;R()" style="cursor:pointer;font-size:11px;padding:5px 14px">加载更多 (剩余'+(S.pps.length-sh)+'篇)</button></div>';
    h+='</div>';
    h+='<div style="font-size:10px;color:var(--muted);background:var(--hover);border-radius:8px;padding:10px 14px;margin-top:8px;line-height:1.7"><b>📥 获取 PDF：</b>复制 DOI 到 <a href="https://sci-hub.se" target="_blank" style="color:var(--brand)">Sci-Hub</a> · <a href="https://sci-hub.st" target="_blank" style="color:var(--brand)">镜像</a> · <a href="https://scholar.google.com" target="_blank" style="color:var(--brand)">谷歌学术</a> · 学校图书馆 → 拖拽 PDF 到本页上传构建知识库</div>';
  }
  document.getElementById('cc').innerHTML=h;
  // Preview panel
  document.getElementById('ht').textContent=S.q||'PaperLink';
  var el=document.getElementById('st');var txt=PHASES[S.phase]||S.phase;if(el.textContent!==txt){el.innerHTML='<span class=\"count-pop\" style=\"display:inline-block\">'+txt+'</span>';setTimeout(function(){el.textContent=txt},350)}else{el.textContent=txt};
  // Smart scroll: only auto-scroll if user is near bottom, or if this is a user action
  var cc=document.getElementById('cc');
  if(S._autoScroll!==false){cc.scrollTop=cc.scrollHeight}
  // Reset auto-scroll after user-initiated actions
  if(S._resetScroll){cc.scrollTop=0;S._resetScroll=false}
}
// Track manual scroll
document.addEventListener('DOMContentLoaded',function(){document.getElementById('cc').addEventListener('scroll',function(){var cc=this;S._autoScroll=cc.scrollHeight-cc.scrollTop-cc.clientHeight<80})});
function PR(p){let dl_url=p.download_url||p.pdf_url,prv_url=p.preview_url||p.doi_url||p.cnki_url||'#';return'<div class="paper"><div class="icon"><input type="checkbox" id="chk_'+escA(p.paper_id)+'" style="margin-right:2px;cursor:pointer" title="选择加入图谱"></div><div class="info"><div class="ptitle"><a href="javascript:void(0)" onclick="PV(\''+escA(p.paper_id)+'\')" title="点击预览摘要">'+esc(p.title)+'</a></div><div class="pmeta">'+esc(p.authors||'')+' · '+(p.year||'')+' · '+(p.source||'')+'</div><div class="tags">'+(dl_url?'<a href="'+esc(dl_url)+'" download class="tag green">⬇ 下载</a>':'<span class="tag yellow">🔒</span>')+(prv_url&&prv_url!=='#'?'<a href="'+esc(prv_url)+'" target="_blank" class="tag purple">🔍 在线</a>':'')+(p.cnki_url?'<a href="'+esc(p.cnki_url)+'" target="_blank" class="tag red">📚 知网</a>':'')+(p.google_scholar_url?'<a href="'+esc(p.google_scholar_url)+'" target="_blank" class="tag blue">GS</a>':'')+(p.doi_url?'<a href="'+esc(p.doi_url)+'" target="_blank" class="tag gray">DOI</a>':'')+'<span class="tag gray" style="cursor:pointer" onclick="PV(\''+escA(p.paper_id)+'\')">👁 预览</span><span class="tag gray" style="cursor:pointer" onclick="navigator.clipboard.writeText(\''+escA(p.title)+'\')">📋</span></div></div></div>'}
function PV(pid){var p=S.pps.find(function(x){return x.paper_id===pid});if(!p)return;S.ppv=p;buildPreview(p)}
function buildPreview(p){
  var old=document.getElementById('ppv');if(old)old.remove();
  var el=document.createElement('div');el.id='ppv';
  el.style.cssText='position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:16px;overflow-y:auto;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.3)';
  var h='<button onclick="var x=document.getElementById(\'ppv\');if(x)x.remove();S.ppv=null" style="float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px">&times;</button>';
  h+='<h3 style="font-size:13px;color:var(--brand);margin:0 0 6px;line-height:1.5">'+esc(p.title||'')+'</h3>';
  h+='<p style="font-size:10px;color:var(--muted);margin:0 0 10px">'+esc(p.authors||'?')+' &middot; '+(p.year||'?')+' &middot; '+esc(p.source||'')+'</p>';
  h+='<div style="font-size:11px;color:var(--muted);line-height:1.6;max-height:250px;overflow-y:auto;border-top:1px solid var(--border);padding-top:8px;margin-bottom:8px"><b>Abstract:</b> '+esc((p.abstract||'Not available').substring(0,1200))+'</div>';
  // Lazy PDF: button to load iframe, not auto-download
  if(p.pdf_url){
    var pdfId='pdf_'+Math.random().toString(36).substr(2,6);
    h+='<button id="btn_'+pdfId+'" onclick="document.getElementById(\''+pdfId+'\').style.display=\'block\';this.style.display=\'none\'" class="tag green" style="font-size:11px;padding:5px 10px;cursor:pointer;margin:8px 0;display:block;width:100%">&#9654; Click to preview PDF</button>';
    h+='<iframe id="'+pdfId+'" src="'+esc(p.pdf_url)+'#view=FitH" width="100%" height="380" style="display:none;border:1px solid var(--border);border-radius:8px;margin:8px 0" loading="lazy"></iframe>';
  }
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px">';
  if(p.doi)h+='<a href="https://doi.org/'+p.doi+'" target="_blank" class="tag gray" style="font-size:11px;padding:5px 10px;text-decoration:none">DOI</a>';
  if(p.cnki_url)h+='<a href="'+esc(p.cnki_url)+'" target="_blank" class="tag gray" style="font-size:11px;padding:5px 10px;text-decoration:none">CNKI</a>';
  if(p.pdf_url)h+='<a href="'+esc(p.pdf_url)+'" download class="tag green" style="font-size:11px;padding:5px 10px;text-decoration:none">Download PDF</a>';
  h+='<button class="tag gray" style="font-size:11px;padding:5px 10px;cursor:pointer" onclick="KGadd()">Add to Graph</button>';
  h+='</div>';
  el.innerHTML=h;document.getElementById('cc').appendChild(el);
}
async function KGadd(){var p=S.ppv;if(!p)return;try{await fetch(A+'/kg/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:p.paper_id})});window.open('/static/kg.html','_blank')}catch(e){alert('图谱更新失败: '+e.message)}}
async function KGBatch(){let ids=[];S.pps.forEach(p=>{let el=document.getElementById('chk_'+escA(p.paper_id));if(el&&el.checked)ids.push(p.paper_id)});if(!ids.length)return alert('请先勾选论文');try{await fetch(A+'/kg/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:ids.join(',')})});window.open('/static/kg.html','_blank')}catch(e){alert('图谱更新失败: '+e.message)}}
function K(){var el=document.getElementById('tl');if(!S.ts.length){el.innerHTML='<div style="text-align:center;color:var(--muted);font-size:10px;padding:16px">No topics</div>';return}var h='';for(var i=0;i<S.ts.length;i++){var t=S.ts[i];var st=(t.status==='ready'||t.papers>0)?(t.papers||'')+' papers':'new';h+='<div class="topic-item'+(t.topic_id===S.tid?' active':'')+'" data-tid="'+t.topic_id+'"><div style="flex:1;display:flex;flex-direction:column"><div class="tname">'+esc(t.query||'New')+'</div><div class="tmeta">'+st+'</div></div><button onclick="event.stopPropagation();D(\''+t.topic_id+'\')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 6px" title="Delete">x</button></div>'}el.innerHTML=h}
// Event delegation: click any .topic-item -> call W()
(function(){var tl=document.getElementById('tl');tl.addEventListener('click',function(e){var item=e.target.closest('.topic-item');if(item){var tid=item.getAttribute('data-tid');if(tid)W(tid)}})})()
function md(t){if(!t)return'';let h=esc(t);h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');h=h.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return'<p>'+h+'</p>'}
async function D(id){if(!confirm('Delete topic?'))return;try{await fetch(A+'/topic/'+id,{method:'DELETE'});S.ts=S.ts.filter(function(t){return t.topic_id!==id});if(S.tid===id)N();K()}catch(e){}}
async function copyDOIs(){var ds=S.pps.filter(function(p){return p.doi}).map(function(p){return p.doi});if(!ds.length)return;navigator.clipboard.writeText(ds.join("\n"));alert("已复制 "+ds.length+" 个DOI")}
function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escA(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}
function isCN(t){t=t||'';for(let i=0;i<t.length;i++){let c=t.charCodeAt(i);if(c>=19968&&c<=40869)return true}return false}
</script>
