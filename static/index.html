<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperLink &mdash; 直达论文</title>
<style>
/* ============================================================
   PaperLink · 学术研究助手 — 暖纸 × 深茶绿
   依据 taste-skill (单强调色/反AI蓝紫/反卡片滥用) + impeccable (craft floor)
   + ui-ux-pro-max (学术调性配色)。保留全部 class 名, 仅重设计视觉层。
   ============================================================ */
:root,.light{--bg:#faf9f7;--card:#fff;--text:#1c1917;--muted:#78716c;--border:#e7e5e4;--brand:#0f766e;--brand-light:#0d9488;--brand-strong:#0f766e;--green:#047857;--hover:#f5f5f4;--input-bg:#fff;--shadow:0 1px 3px rgba(28,25,23,.06),0 4px 16px rgba(28,25,23,.04);--red:#b91c1c;--ring:rgba(15,118,110,.14)}
.dark{--bg:#16140f;--card:#211e19;--text:#e7e5e4;--muted:#a8a29e;--border:#3f3b36;--brand:#2dd4bf;--brand-light:#5eead4;--brand-strong:#0d9488;--green:#34d399;--hover:#2b2823;--input-bg:#211e19;--shadow:0 1px 3px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.22);--red:#f87171;--ring:rgba(45,212,191,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Noto Sans SC','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* 暖调顶部光晕 — 替代 AI 蓝紫 */
.glow{position:fixed;top:-256px;left:0;right:0;height:512px;background:radial-gradient(ellipse at 50% 0,rgba(15,118,110,.06) 0,transparent 70%);pointer-events:none;z-index:0}
/* Sidebar */
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:10;flex-shrink:0}
.sidebar h2{font-size:14px;font-weight:700;letter-spacing:-.01em;padding:15px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.sidebar h2 i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand-strong),#0d9488);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;box-shadow:0 2px 8px var(--ring)}
.sidebar .btn-new{width:calc(100% - 20px);padding:9px;margin:12px 10px;background:linear-gradient(135deg,var(--brand-strong),#0d9488);color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 3px 12px var(--ring)}
.sidebar .btn-new:hover{box-shadow:0 5px 16px var(--ring);filter:brightness(1.05)}
.sidebar .btn-new:active{transform:scale(.97)}
.topic-list{flex:1;overflow-y:auto;padding:6px 8px}
.topic-item{padding:9px 12px;border-radius:10px;cursor:pointer;font-size:11px;margin:3px 2px;border-left:3px solid transparent;transition:background .15s,border-color .15s}
.topic-item:hover{background:var(--hover)}
.topic-item.active{background:color-mix(in srgb,var(--brand) 9%,transparent);border-left-color:var(--brand)}
.topic-item .tname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-item .tmeta{font-size:10px;color:var(--muted)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;max-height:100vh}
/* ===== 专业应用头部 ===== */
.topbar{position:relative;padding:0 16px;height:54px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:9px;min-width:0}
.topbar .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand-strong),#0d9488);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 2px 10px var(--ring);flex-shrink:0}
.topbar .brand-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.topbar .conn{font-size:10px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:7px}
.topbar select,.topbar .chip{font-size:11px;padding:6px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer;transition:border-color .15s,box-shadow .15s;outline:none;font-weight:500}
.topbar select:hover,.topbar .chip:hover{border-color:var(--brand)}
.topbar select:focus,.topbar .chip:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.topbar .chip:active{transform:scale(.96)}
.topbar .icon-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.topbar .sep{color:var(--muted);font-size:10px}
.agent-on{background:var(--brand-strong)!important;color:#fff!important;border-color:var(--brand-strong)!important}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
/* Messages */
@keyframes popIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg{animation:popIn .3s cubic-bezier(.16,1,.3,1) both}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{max-width:80%;background:var(--brand-strong);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 16px;font-size:13px;line-height:1.55;box-shadow:0 3px 12px var(--ring)}
.msg{display:flex;flex-direction:column;align-items:flex-start}
.msg.user{align-items:flex-end}
.msg .card{max-width:88%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;font-size:13px;line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px color-mix(in srgb,var(--text) 4%,transparent);transition:border-color .15s}
.u-actions{display:flex;gap:4px;margin-top:3px}
.u-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:6px}
.u-actions button:hover{background:var(--hover);color:var(--text)}
.msg .card:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--border))}
/* Action buttons — 灰底 → 强调色 hover, 触觉反馈 */
.msg-actions{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.msg-actions button,.msg-actions a{display:inline-flex!important;align-items:center;gap:5px;padding:7px 15px;font-size:13px;font-weight:600;background:var(--hover);border:1.5px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none;line-height:1.2}
.msg-actions button:hover,.msg-actions a:hover{background:var(--brand-strong);color:#fff;border-color:var(--brand-strong)}
.msg-actions button:active,.msg-actions a:active{transform:scale(.97)}
/* Markdown */
.msg h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:7px}
.msg h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:10px 0 5px}
.msg h3{font-size:13px;font-weight:600;margin:7px 0 3px}
.msg pre{background:#1c1917;color:#e7e5e4;border-radius:9px;padding:11px 14px;font-size:12px;line-height:1.55;overflow-x:auto;margin:7px 0}
.msg code{background:var(--hover);padding:2px 6px;border-radius:5px;font-size:12px;color:var(--brand)}
.msg pre code{background:transparent;padding:0;color:inherit}
.msg blockquote{border-left:3px solid var(--brand);margin:7px 0;padding:5px 13px;color:var(--muted);font-size:12px;background:var(--hover);border-radius:0 7px 7px 0}
.msg a{color:var(--brand)}
.msg a:hover{text-decoration:underline}
.msg ul,.msg ol{padding-left:20px;margin:5px 0}
/* Section titles */
.cn-header,.en-header{font-weight:700;font-size:12px;padding:7px 0;margin:7px 0 5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.cn-header{color:var(--red)}
.en-header{color:var(--brand)}
.cn-header .badge,.en-header .badge{font-size:10px;padding:2px 9px;border-radius:10px;font-weight:500}
.cn-header .badge{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.en-header .badge{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
/* Paper card */
.paper{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:11px;margin-bottom:4px;background:var(--card);border:1px solid var(--border);transition:border-color .15s,box-shadow .15s}
.paper:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.paper .icon{font-size:16px;flex-shrink:0;margin-top:2px}
.paper .info{flex:1;min-width:0}
.paper .info .ptitle{font-size:12px;font-weight:500;margin-bottom:3px;line-height:1.4}
.paper .info .ptitle a{color:var(--text);text-decoration:none}
.paper .info .ptitle a:hover{color:var(--brand)}
.paper .info .pmeta{font-size:10px;color:var(--muted);margin-bottom:4px}
.paper .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:2px;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:500;text-decoration:none}
.tag.green{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.tag.yellow{background:#fef9c3;color:#854d0e}.dark .tag.yellow{background:#713f12;color:#fde047}
.tag.red{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red)}
.tag.blue{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.tag.gray{background:var(--hover);color:var(--muted);cursor:pointer}
.tag.gray:hover{background:var(--border)}
/* purple tag 归并到强调色 — 单一强调色原则 */
.tag.purple{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);text-decoration:none}
/* Skill selector + Agent toggle */
.skill-sel{font-size:10px;padding:4px 7px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--text);cursor:pointer;max-width:90px}
.agent-on{background:var(--brand-strong)!important;color:#fff!important}
/* Pi-Agent trace */
.pi-trace{padding:8px 12px;margin:4px 0;border-radius:8px;font-size:10px;border-left:3px solid var(--brand);background:var(--hover);animation:popIn .3s ease-out}
.pi-trace.tool-ok{border-left-color:var(--green)}
.pi-trace.tool-err{border-left-color:var(--red)}
.pi-trace .step-num{font-weight:600;color:var(--brand);margin-right:4px}
/* Progress bar */
.progress{position:fixed;bottom:20px;right:20px;z-index:100;width:300px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.15);display:none}
.progress .bar{width:100%;height:8px;background:var(--hover);border-radius:4px;overflow:hidden;margin:10px 0}
.progress .fill{height:100%;background:var(--brand-strong);border-radius:4px;transition:width .4s ease-out;animation:softPulse 2s infinite}
@keyframes softPulse{0%,100%{opacity:.85}50%{opacity:1}}
.progress .title{font-weight:600;font-size:12px;color:var(--brand);display:flex;justify-content:space-between}
.progress .detail{font-size:10px;color:var(--muted);margin-top:4px}
/* Loading */
.loading{padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.skeleton{background:linear-gradient(90deg,var(--hover) 25%,var(--border) 50%,var(--hover) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:14px;margin:5px 0}
.skeleton.w60{width:60%}.skeleton.w80{width:80%}.skeleton.w90{width:90%}.skeleton.w100{width:100%}
.skeleton.title{height:18px;width:45%;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading .status{font-size:12px;font-weight:600;color:var(--brand);margin-bottom:6px}
/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:24px;text-align:center;cursor:pointer;margin:0 14px 8px;transition:.15s}
.upload-zone:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 4%,transparent)}
/* Input */
.input-bar{padding:12px 18px 16px;display:flex;gap:10px;background:linear-gradient(0deg,color-mix(in srgb,var(--bg) 60%,transparent),transparent)}
.input-bar textarea{flex:1;border:1px solid var(--border);border-radius:16px;padding:12px 16px;font-size:13px;resize:none;outline:none;font-family:inherit;line-height:1.5;max-height:120px;background:var(--input-bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px color-mix(in srgb,var(--text) 4%,transparent);transition:border-color .15s,box-shadow .15s}
.input-bar textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.input-bar .send-btn{padding:11px 22px;background:var(--brand-strong);color:#fff;border:none;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 3px 12px var(--ring)}
.input-bar .send-btn:hover{box-shadow:0 5px 18px var(--ring);transform:translateY(-1px)}
.input-bar .send-btn:active{transform:translateY(0) scale(.96)}
.input-bar .send-btn:disabled{opacity:.5;cursor:not-allowed}
/* 全局焦点可见性 (无障碍) */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* Shimmer 文字动画 */
.shimmer-text{display:inline-block;background:linear-gradient(90deg,var(--muted) 25%,var(--brand) 50%,var(--muted) 75%);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer-text 2s linear infinite}
@keyframes shimmer-text{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Agent step card */
.agent-step{padding:10px 14px;margin:4px 0;border-radius:10px;font-size:11px;border-left:3px solid var(--brand);background:var(--hover);animation:popIn .3s ease-out}
.agent-step .label{font-weight:600;color:var(--brand);margin-bottom:4px}
.agent-step .detail{color:var(--muted);font-size:10px}

/* Strategy cards */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.strat-card{background:var(--hover);border-radius:10px;padding:10px 12px}
.strat-card .db{font-size:10px;color:var(--muted);margin-bottom:4px}
.strat-card pre{font-size:11px;white-space:pre-wrap;color:var(--text);background:transparent;margin:0;padding:0}
/* Footnote */
.footnote{font-size:9px;color:var(--muted);text-align:center;padding:8px;border-top:1px solid var(--border);margin-top:auto}
.footnote a{color:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1.5s ease-in-out infinite;vertical-align:middle;margin-right:4px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.dots-bar{display:flex;gap:3px;margin:4px 0 8px;flex-wrap:wrap}
.dots-bar i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--border);transition:all .3s}
.dots-bar i.on{background:var(--brand);box-shadow:0 0 4px var(--brand-light)}
.topbar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.topbar .dot.live{background:var(--green);animation:dotLive 2s ease-in-out infinite}
.topbar .dot.idle{background:var(--muted)}
@keyframes dotLive{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 40%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 0%,transparent)}}
.count-pop{animation:countPop .35s ease-out}
@keyframes countPop{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
/* 可访问性 (a11y): 键盘焦点可见 + 尊重减弱动效偏好 (纯增量, 不破坏现有布局) */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div class="glow"></div>
<div id="fbar" style="position:fixed;top:0;left:0;right:0;height:2px;z-index:200;display:none;background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:60px 100%;animation:shimmer 1s linear infinite"></div>

<aside class="sidebar">
  <h2><i>P</i>PaperLink</h2>
  <div style="padding:0 10px"><button class="btn-new" onclick="N()">+ 新建课题</button></div>
  <nav class="topic-list" id="tl"></nav>
  <div class="footnote">
    本平台仅提供论文元数据索引<br>不存储或分发受版权保护的论文全文
    <br><br>  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="bm">P</span><span class="brand-name" id="ht">PaperLink</span></div>
    <span class="conn" id="st"></span><span class="dot live" id="ldot" style="display:none"></span>
    <span style="margin-left:auto"></span>
    <div class="top-actions">
      <span id="quotaChip" class="chip" style="font-size:11px;cursor:pointer" onclick="refreshQuota()" title="DeepSeek 账户余额">💰 --</span>
      <button class="chip" onclick="showSubs()" title="管理订阅方向">📡 订阅</button>
      <!-- 收款暂缓: 充值按钮隐藏, 冷启动期不误导用户 (Stripe 接入时恢复) -->
      <select id="exportFmt" onchange="EX(this.value)" title="导出">
        <option value="">导出</option>
        <option value="markdown">↓ MD</option>
        <option value="docx">↓ DOCX</option>
        <option value="latex">↓ LaTeX</option>
        <option value="bibtex">↓ BibTeX</option>
      </select>
      <button class="chip icon-btn" id="userChip" onclick="showLogin()" title="登录/注册">👤</button>
      <button class="chip icon-btn" onclick="T()" title="暗色模式">🌓</button>
    </div>
  </header>
  <div id="approval-bar" style="display:none;margin:0 14px 8px;padding:10px 14px;background:color-mix(in srgb,var(--brand) 8%,transparent);border:2px solid var(--brand);border-radius:12px;font-size:12px">
    <div style="font-weight:600;color:var(--brand);margin-bottom:6px">&#9888; 人工审批闸门</div>
    <div id="approval-text" style="margin-bottom:8px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="approvalGo()" style="padding:5px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px">确认通过</button>
      <button onclick="showApprovalFeedback()" style="padding:5px 14px;background:var(--brand);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px">修改后通过</button>
    </div>
    <textarea id="approval-fb" style="display:none;width:100%;margin-top:6px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;resize:none;background:var(--bg);color:var(--text)" rows="2" placeholder="输入修正意见..."></textarea>
    <button id="approval-submit" onclick="TA_submit()" style="display:none;margin-top:6px;padding:5px 14px;background:var(--green);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px">提交并继续</button>
  </div>
  <div class="chat" id="cc"></div>
  <div class="upload-zone" id="uz" style="display:none" onclick="document.getElementById('fi').click()" ondragover="event.preventDefault()" ondrop="H(event)">
    <input type="file" id="fi" accept=".pdf" multiple style="display:none" onchange="F(this.files)">
    <div style="font-size:28px;margin-bottom:6px">📤</div>
    <p style="font-size:13px;color:var(--muted)">拖拽或点击上传 PDF 论文</p>
  </div>
  <div class="input-bar">
    <div id="suggestBar" style="font-size:11px;color:var(--muted);padding:2px 4px;margin-bottom:4px;display:none">💡 建议: <span id="suggestText"></span> <button class="chip" id="suggestGo" onclick="doSuggest(S._suggestAction)" style="display:none;font-size:11px;margin-left:6px">执行 →</button></div>
    <div id="actionBar" style="display:none;gap:8px;margin-bottom:6px">
      <button class="chip" onclick="nextSearch()" style="background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600">🔍 搜索相关论文</button>
      <button class="chip" onclick="nextUpload()">📤 上传 PDF 建库</button>
    </div>
    <textarea id="ui" rows="1" placeholder="输入研究方向，先看这题值不值得做…" onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();X()}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" oncompositionstart="this.dataset.composing='1'" oncompositionend="this.dataset.composing='0'"></textarea>
    <button class="send-btn" id="btnStop" onclick="ST()" style="display:none;padding:8px 10px;font-size:11px;background:#e5484d;color:#fff;border:none;border-radius:14px;cursor:pointer;white-space:nowrap">⏹ 停止</button>
    <button class="send-btn" onclick="X()">发送</button>
  </div>
</main>

<div class="progress" id="pg">
  <div class="title"><span>📥 构建知识库</span><span id="pc" style="font-size:10px">0/0</span></div>
  <div class="bar"><div class="fill" id="pf" style="width:0%"></div></div>
  <div class="detail"><span id="pd">准备中…</span></div>

async function SR(q,ke,kc){

}async function XX(){var el=document.getElementById('ui');var t=el.value.trim();if(!t||S.phase==='thinking'||S.phase==='building')return;el.value='';el.style.height='auto';S._resetScroll=true;S._autoScroll=true;if(!S.tid){/* 统一流程: 无课题 → 先选题判断 (钩子) */S.q=t;Ae('user',t);S.msgs[S.msgs.length-1].g=true;await GAP(t);document.getElementById('actionBar').style.display='flex';saveSession();R();return}Ae('user',t);if(S.useAgent){await PI(t)}else{await CHAT(t)}refreshSuggest()}
async function CHAT(q){setPhase('thinking');try{var hist=S.msgs.filter(function(m){return m.r==='u'||m.r==='a'}).slice(-10);var r=await fetch(A+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:hist})});var d=await r.json();if(!r.ok){Ae('s',d.detail||('请求失败 ('+r.status+')'));return}Ae('a',d.answer||'生成失败')}catch(e){Ae('s','提问失败: '+(e.message||'网络错误'))}setPhase('papers_loaded');saveSession();R()}
async function GAP(q){setPhase('thinking');try{var r=await fetch(A+'/research_gap',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({topic:q})});if(!r.ok){try{var de=await r.json();Ae('s',de.detail||('请求失败 ('+r.status+')'))}catch(e){Ae('s','请求失败 ('+r.status+')')}setPhase('papers_loaded');R();return}var reader=r.body.getReader(),decoder=new TextDecoder(),buf='',ans='',lastR=0;S.msgs.push({r:'a',c:'▌ 正在检索文献…'});R();while(true){var _a=await reader.read(),value=_a.value,done=_a.done;if(done)break;buf+=decoder.decode(value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){var l=lines[i];if(l.indexOf('data: ')!==0)continue;try{var d=JSON.parse(l.slice(6));if(d.event==='status'){S.msgs[S.msgs.length-1].c='▌ '+d.message;R()}else if(d.event==='token'){ans+=d.token;var now=Date.now();if(now-lastR>80){S.msgs[S.msgs.length-1].c=ans;var me=document.querySelector('#msg-'+(S.msgs.length-1)+' .md-body');if(me)me.innerHTML=md(ans+'▌');lastR=now}}else if(d.event==='done'){S.msgs[S.msgs.length-1].c=ans||'（无回答）';R()}else if(d.event==='error'){S.msgs[S.msgs.length-1].c='❌ '+d.message;R()}}catch(e){}}}if(lastR===0){S.msgs[S.msgs.length-1].c=ans||'（无回答）';R()}}catch(e){Ae('s','选题判断失败: '+(e.message||'网络错误'))}setPhase('papers_loaded');R()}

async function nextSearch(){var b=document.getElementById('actionBar');if(b)b.style.display='none';if(!S.tid&&S.q){if(!(await lightCreate(S.q))){Ae('s','建课题失败，请重试');return}}if(S.tid){SR(S.q,(S.strategy||{}).keywords_en,(S.strategy||{}).keywords_cn);setPhase('papers_loaded');R()}refreshSuggest()}
async function nextUpload(){var b=document.getElementById('actionBar');if(b)b.style.display='none';if(!S.tid&&S.q){if(!(await lightCreate(S.q))){Ae('s','建课题失败，请重试');return}}var u=document.getElementById('uz');if(u)u.style.display='block';refreshSuggest()}

async function QQ(q){setPhase('thinking');try{var hist=S.msgs.filter(function(m){return m.r==='u'||m.r==='a'}).slice(-10);var r=await fetch(A+'/ask/stream',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({topic_id:S.tid,question:q,history:hist})});if(!r.ok){try{var de=await r.json();Ae('s',de.detail||('请求失败 ('+r.status+')'))}catch(e){Ae('s','请求失败 ('+r.status+')')}return}var reader=r.body.getReader(),decoder=new TextDecoder(),buf='',ans='';S.msgs.push({r:'a',c:'▌'});R();while(true){var _a=await reader.read(),value=_a.value,done=_a.done;if(done)break;buf+=decoder.decode(value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';for(var i=0;i<lines.length;i++){var l=lines[i];if(l.indexOf('data: ')!==0)continue;try{var d=JSON.parse(l.slice(6));if(d.token!==undefined){ans+=d.token;S.msgs[S.msgs.length-1].c=ans+'▌';R()}else if(d.error){S.msgs[S.msgs.length-1].c='❌ '+d.error;R()}}catch(e){}}}S.msgs[S.msgs.length-1].c=ans||'（无回答）';R()}catch(e){Ae('s','提问失败: '+(e.message||'网络错误'))}setPhase('papers_loaded');saveSession();R()}
function HH(e){e.preventDefault();FF(e.dataTransfer.files)}
async function FF(files){if(!files.length||!S.tid)return;setPhase('thinking');var fd=new FormData();for(var i=0;i<files.length;i++)fd.append('files',files[i]);try{var r=await fetch(A+'/upload_pdf/'+S.tid,{method:'POST',headers:authHeaders(),body:fd});var d=await r.json();setPhase('ready');document.getElementById('uz').style.display='none';Ae('s','✅ 知识库就绪！'+d.papers+'篇, '+d.chunks+'个文本块');await L()}catch(e){Ae('s','❌ '+e.message)}setPhase('papers_loaded');R()}
async function BB(){var urls=S.pps.filter(function(p){return p.pdf_url}).map(function(p){return p.pdf_url});if(!urls.length)return alert('没有可下载的论文，请拖拽 PDF 上传');S._kbDone=null;var pg=document.getElementById('pg');pg.style.display='block';document.getElementById('pc').textContent='0/'+urls.length;document.getElementById('pf').style.width='0%';clearInterval(S.pi);S.pi=setInterval(async function(){try{var r=await fetch(A+'/topic_status/'+S.tid,{headers:authHeaders()});var d=await r.json();if(d.status==='ready'){clearInterval(S.pi);if(S._kbDone)return;S._kbDone=true;document.getElementById('pf').style.width='100%';document.getElementById('pc').textContent='✅';document.getElementById('pd').textContent=d.progress;var dl=(S.pps||[]).filter(function(p){return urls.indexOf(p.pdf_url)>=0});var _cnt=(S._importedN||dl.length||0);var listHtml='<details><summary>📄 已入库论文（'+_cnt+' 篇，点击展开）</summary>'+dl.map(function(p,i){return '<div style="margin:2px 0">'+(i+1)+'. '+esc(p.title)+'</div>'}).join('')+'</details>';Ae('s','✅ **知识库就绪！**\n\n已解析 **'+_cnt+' 篇论文**加入知识库（不是下载到本地，可直接基于它们提问）：\n\n'+listHtml+'\n\n现在可以提问了！');var ui=document.getElementById('ui');if(ui)ui.placeholder='✅ 知识库已就绪，输入问题开始基于证据问答…';setPhase('ready');document.getElementById('uz').style.display='none';await L();refreshSuggest();setTimeout(function(){pg.style.display='none'},3000)}else if(d.step){var pct=d.total?Math.round(d.current/d.total*100):0;document.getElementById('pf').style.width=pct+'%';document.getElementById('pc').textContent=(d.current||0)+'/'+(d.total||urls.length);document.getElementById('pd').textContent=((d.step==='downloading')?'下载中… 中文':'解析/建库中… 中文')+(d.cn_papers||0)+' 英文'+(d.en_papers||0)}}catch(e){}},1200);setPhase('building');try{var r2=await fetch(A+'/download_bulk',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({urls:urls,topic_id:S.tid})});S._importedN=parseInt((r2.headers.get('X-Imported')||'0'))||0;if(!r2.ok){var de=await r2.json();alert(de.detail||'建库失败')}}catch(e){clearInterval(S.pi);pg.style.display='none';alert('建库失败，请重试')}setPhase('papers_loaded');R()}
async function PI(task){S.piSteps=[];S.agent=true;setPhase('thinking');showStop(true);R();try{
  var body={task:task,goal:S.q||'',max_steps:15,topic_id:S.tid||''};
  var skl=S.skill||'auto';
  if(skl!=='auto'&&skl!=='research_team'){body.skills=[skl]}
  var ac=new AbortController();S._abort=ac;
  var r=await fetch(A+'/agent/pi/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ac.signal});
  if(!r.ok){S.agent=false;showStop(false);try{var de=await r.json();Ae('s',de.detail||('请求失败 ('+r.status+')'))}catch(e){Ae('s','请求失败 ('+r.status+')')}setPhase('papers_loaded');saveSession();R();return}
  var reader=r.body.getReader(),decoder=new TextDecoder(),buf='',stepsTxt='',piAns='';
  S.msgs.push({r:'a',c:'▌'});R();
  while(true){
    var _a=await reader.read(),value=_a.value,done=_a.done;
    if(done)break;
    buf+=decoder.decode(value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop()||'';
    for(var i=0;i<lines.length;i++){var l=lines[i];
      if(l.indexOf('data: ')!==0)continue;
      try{var d=JSON.parse(l.slice(6));
        if(d.event==='step'){piAns='';stepsTxt+='#'+d.turn+' '+(d.success?'✓':'✗')+' '+(d.tool)+' ('+(d.elapsed_ms||0)+'ms)\n';S.msgs[S.msgs.length-1].c=stepsTxt+'▌';R()}
        else if(d.event==='token'){piAns+=d.token;S.msgs[S.msgs.length-1].c=(stepsTxt?stepsTxt+'\n\n':'')+piAns+'▌';R()}
        else if(d.event==='result'){
          S.agent=false;showStop(false);
          if(d.paused){S._piRunId=d.run_id||'';document.getElementById('approval-bar').style.display='block';document.getElementById('approval-text').innerHTML='<b>⚠️ 需要人工确认</b><br>Agent 请求执行: <b>'+(d.need_confirm?d.need_confirm.tool_name:'工具')+'</b><br>确认后执行，或拒绝让 Agent 换路';Ae('s','## ⚠️ 需要人工确认\n\nAgent 请求执行: **'+(d.need_confirm?d.need_confirm.tool_name:'')+'**\n\n_等待人工确认..._');break}
          var res=d.result||'';
          S.msgs[S.msgs.length-1].c=res||stepsTxt||'（无结果）';R();
          if(d.trace){Ae('s',renderTrace(d.trace))}
          /* v3 主动推进: Agent 完成实质工作后, 主动递上下一步建议 */
          var _usedTools=d.trace&&d.trace.tools_used&&d.trace.tools_used.length;
          refreshSuggest();
          if(_usedTools||(res&&res.length>300)){setTimeout(function(){var st=document.getElementById('suggestText');if(st&&st.textContent)Ae('s','🔜 下一步建议: '+st.textContent)},250)}
        }else if(d.event==='error'){S.agent=false;S.msgs[S.msgs.length-1].c='❌ '+(d.message||'错误');R()}
      }catch(e){}
    }
  }
  S.agent=false;showStop(false);
}catch(e){S.agent=false;showStop(false);if(e&&e.name==='AbortError'){Ae('s','⏹ Agent 已停止')}else{Ae('s','Agent Error: '+(e.message||'network'))}}
setPhase('papers_loaded');saveSession();R()}

// ===== 登录/注册 (auth 入口: 补足 JWT 后端的 UI 触达) =====
function authHeaders(h){h=h||{};var t=localStorage.getItem('pl_token');if(t)h['Authorization']='Bearer '+t;return h}
function updateUserChip(){var u=localStorage.getItem('pl_user');var el=document.getElementById('userChip');if(!el)return;if(u){el.textContent='👤 '+u;el.title='退出登录';el.onclick=logout}else{el.textContent='👤 登录';el.title='登录/注册';el.onclick=showLogin}}
function showLogin(){var m=document.getElementById('modal');if(m)m.style.display='flex';var i=document.getElementById('lgUser');if(i)i.focus()}
function closeModal(){var m=document.getElementById('modal');if(m)m.style.display='none'}
async function doLogin(){var u=document.getElementById('lgUser').value.trim(),p=document.getElementById('lgPass').value;if(!u||!p)return alert('请输入用户名和密码');try{var r=await fetch(A+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});var d=await r.json();if(!r.ok)return alert(d.detail||'登录失败');localStorage.setItem('pl_token',d.access_token);localStorage.setItem('pl_user',d.user||u);closeModal();updateUserChip();L()}catch(e){alert('登录失败: '+e.message)}}
async function doRegister(){var u=document.getElementById('lgUser').value.trim(),p=document.getElementById('lgPass').value;if(!u||!p)return alert('请输入用户名和密码');try{var r=await fetch(A+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});var d=await r.json();if(!r.ok)return alert(d.detail||'注册失败');localStorage.setItem('pl_token',d.access_token);localStorage.setItem('pl_user',d.user||u);closeModal();updateUserChip();L()}catch(e){alert('注册失败: '+e.message)}}
function logout(){localStorage.removeItem('pl_token');localStorage.removeItem('pl_user');updateUserChip();L()}
// ===== Zotero 导入入口 (补足本地 Zotero 桥的 UI 触达) =====
async function showZotero(){var m=document.getElementById('zmodal'),box=document.getElementById('zlist');if(!m)return;m.style.display='flex';box.innerHTML='加载中…';try{var r=await fetch(A+'/zotero/scan');var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.detail||d.error||'scan 失败');if(!d.papers||!d.papers.length){box.innerHTML='<div style="color:var(--muted);padding:12px 0">未检测到本地 Zotero 期刊文献（扫描 ~/Zotero/zotero.sqlite）。<br>请先在 Zotero 建立文献库再试。</div>';return}box.innerHTML=d.papers.map(function(p,i){return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border)"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.title||'条目'+(i+1))+(p.year?' <span style="color:var(--muted)">('+esc(p.year)+')</span>':'')+'</span><button class="chip" onclick="importZotero(\''+escA(p.zotero_key)+'\')">导入</button></div>'}).join('')}catch(e){box.innerHTML='<div style="color:var(--red,#e5484d)">Zotero 读取失败: '+esc(e.message)+'</div>'}}
async function importZotero(key){try{var s=null;try{s=await(await fetch(A+'/zotero/scan')).json()}catch(e){}var found=s&&s.papers?(s.papers.find(function(p){return p.zotero_key===key})||{}):{};var meta={title:found.title||'',DOI:found.doi||'',year:found.year||'',collections:[]};var r=await fetch(A+'/zotero/import',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(meta)});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.detail||d.error||'导入失败');alert('已导入: '+(d.title||'')+(d.tip?'\n'+d.tip:''));document.getElementById('zmodal').style.display='none';S.tid=d.topic_id;S.q=d.title;await L()}catch(e){alert('导入失败: '+e.message)}}
function MD(m){S.mode=m;var sb=document.getElementById('suggestBar');if(sb&&m==='gap')sb.style.display='none';var modes=[['modeGap','gap'],['modeFind','find'],['modeWrite','write'],['modeTeam','team']];for(var i=0;i<modes.length;i++){var b=document.getElementById(modes[i][0]);if(b){if(m===modes[i][1]){b.style.background='var(--brand)';b.style.color='#fff';b.style.borderColor='var(--brand)';b.style.fontWeight='600'}else{b.style.background='';b.style.color='';b.style.borderColor='transparent';b.style.fontWeight=''}}}}
function refreshQuota(){try{fetch(A+'/quota',{headers:authHeaders()}).then(function(r){return r.json()}).then(function(d){var el=document.getElementById('quotaChip');if(!el)return;var bal=d.deepseek_balance;if(bal!==null&&bal!==undefined){el.textContent='💰 ¥'+bal;el.style.color='';el.title='DeepSeek 账户余额 ¥'+bal;el.onclick=null}else{el.textContent='💰 余额 --';el.title='DeepSeek 账户余额'}}).catch(function(){})}catch(e){}}
// 阶段感知主动建议: 预判用户在选题→初稿旅程的位置, 递上下一步
function refreshSuggest(){var sb=document.getElementById('suggestBar'),st=document.getElementById('suggestText'),go=document.getElementById('suggestGo');if(!sb||!st)return;if(!S.tid){sb.style.display='none';return}fetch(A+'/suggest?topic_id='+(S.tid||''),{headers:authHeaders()}).then(function(r){return r.json()}).then(function(d){if(d.suggest){S._suggestAction=d.action;S._suggestStage=d.stage;st.textContent=d.suggest;sb.style.display='block';if(go){go.style.display='inline-block'}}else{sb.style.display='none';if(go)go.style.display='none'}}).catch(function(){sb.style.display='none'})}
// 一键执行建议的动作 (并记录接受 → 自我进化优化路由)
function doSuggest(a){if(!a)return;try{fetch(A+'/suggest/accept',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({stage:S._suggestStage,action:a})}).catch(function(){})}catch(e){}var el=document.getElementById('ui');if(a==='new_topic'){if(el)el.focus()}else if(a==='search'){if(S.tid){SR(S.q,(S.strategy||{}).keywords_en,(S.strategy||{}).keywords_cn)}}else if(a==='build_kb'){var oa=S.pps&&S.pps.filter(function(p){return p.pdf_url});if(oa&&oa.length){BB()}else{alert('暂无可下载 OA 论文，请拖拽 PDF 上传')}}else if(a==='ask'){if(el)el.focus()}else if(a==='write'){if(S.tid){PI('请基于当前课题「'+S.q+'」写一篇论文初稿：摘要/引言/相关工作/方法/结论，带引用并声明局限')}}}
window.authHeaders=authHeaders;window.updateUserChip=updateUserChip;window.showLogin=showLogin;window.closeModal=closeModal;window.doLogin=doLogin;window.doRegister=doRegister;window.logout=logout;window.showZotero=showZotero;window.importZotero=importZotero;window.MD=MD;window.refreshQuota=refreshQuota;window.refreshSuggest=refreshSuggest;window.doSuggest=doSuggest;window.nextSearch=nextSearch;window.nextUpload=nextUpload;window.editMsg=editMsg;window.saveEdit=saveEdit;window.cancelEdit=cancelEdit;window.downloadZip=downloadZip;window.showSubs=showSubs;window.unsub=unsub;window.checkAuth=checkAuth;
S.mode='gap';MD('gap');refreshQuota();setInterval(refreshQuota,30000);refreshSuggest();checkUpdates();
updateUserChip();
})();
</script>

    <input id="lgUser" placeholder="用户名 (2-32字符)" style="width:100%;box-sizing:border-box;margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)"/>
    <input id="lgPass" type="password" placeholder="密码 (至少6位)" style="width:100%;box-sizing:border-box;margin-bottom:12px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)"/>

    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--muted)">匿名使用不受影响。登录后新建课题归你名下，历史匿名课题仍共享可见。</div>
  </div>
</div>
