<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Pipeline Trace</title>
<style>
:root{--bg:#16140f;--card:#211e19;--text:#e7e5e4;--muted:#a8a29e;--border:#3f3b36;--blue:#2dd4bf;--blue-strong:#0d9488;--green:#34d399;--purple:#2dd4bf;--amber:#fbbf24;--red:#f87171;--ring:rgba(45,212,191,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
header h1{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
header h1 span{font-size:10px;color:var(--muted);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.pending{background:var(--muted)}.dot.active{background:var(--blue);animation:pulse 1s infinite}.dot.done{background:var(--green)}.dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.query-bar{display:flex;gap:8px;max-width:800px}
.query-bar input{flex:1;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none}
.query-bar input:focus{border-color:var(--blue)}
.query-bar button{padding:10px 20px;background:var(--blue-strong);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.query-bar button:hover{background:#0f766e}.query-bar button:disabled{opacity:.5}
.stop-btn{display:none!important;background:transparent!important;color:var(--red)!important;border:1px solid var(--red)!important}
.stop-btn.show{display:inline-block!important}
.tl{position:relative;padding-left:32px}
.tl::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border)}
.step{position:relative;margin-bottom:8px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;transition:all .3s}
.step.active{border-color:var(--blue);box-shadow:0 0 20px var(--ring)}
.step.done{border-color:var(--green);opacity:.9}
.step.error{border-color:var(--red)}
.step::before{content:'';position:absolute;left:-25px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--bg);z-index:1}
.step.active::before{border-color:var(--blue);background:var(--blue);box-shadow:0 0 10px var(--ring)}
.step.done::before{border-color:var(--green);background:var(--green)}
.step.error::before{border-color:var(--red);background:var(--red)}
.step-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.step-icon{font-size:16px}
.step-name{font-size:12px;font-weight:600}
.step-time{font-size:10px;color:var(--muted);margin-left:auto}
.step-detail{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
.step-detail b{color:var(--text)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.badge.green{background:rgba(34,197,94,.15);color:var(--green)}
.badge.blue{background:var(--ring);color:var(--blue)}
.badge.purple{background:var(--ring);color:var(--purple)}
.badge.amber{background:rgba(245,158,11,.15);color:var(--amber)}
.answer-box{margin-top:16px;padding:16px;background:var(--card);border:1px solid var(--green);border-radius:10px;font-size:13px;line-height:1.6}
.answer-box h3{font-size:12px;color:var(--green);margin-bottom:8px}
.stats-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:120px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-align:center}
.stat-card .v{font-size:22px;font-weight:700;color:var(--blue)}
.stat-card .l{font-size:10px;color:var(--muted);margin-top:2px}
.stream{font-size:13px;line-height:1.7;padding:12px 0;white-space:pre-wrap}
.cursor{display:inline-block;width:2px;height:16px;background:var(--blue);vertical-align:text-bottom;animation:pulse 1s infinite}
</style>
</head>
<body>
<header>
  <h1>RAG Pipeline Trace <span>实时流水线可视化</span></h1>
  <span style="margin-left:auto;font-size:10px;color:var(--muted)"><a href="/" style="color:var(--blue);text-decoration:none">Return to PaperLink</a> &middot; 面试演示用 · 展示检索→生成全链路</span>
</header>
<main>
  <div class="query-bar">
    <input type="text" id="qi" maxlength="500" placeholder="输入问题（能看到每一步的处理过程）..." onkeydown="if(event.key==='Enter'&&!event.isComposing)R()" oncompositionstart="this.dataset.composing='1'" oncompositionend="this.dataset.composing='0'">
    <button id="qb" onclick="R()">追踪</button>
    <button id="qstop" class="stop-btn" onclick="ST()">⏹ 停止</button>
  </div>
  <div id="stats" class="stats-bar"></div>
  <div id="tl" class="tl"></div>
  <div id="answer"></div>
</main>

<script>
var A=window.location.origin.replace(':5173',':8001')||'http://localhost:8001',streaming=false,currentReader=null,stopped=false;
var ICONS={rewrite_start:'',rewrite_done:'',rewrite_skip:'',vector_done:'',bm25_done:'',fusion_done:'',rerank_done:'',rerank_skip:'',generate_start:'',generate_done:'',done:''};
var NAMES={rewrite_start:'查询改写',rewrite_done:'查询改写完成',rewrite_skip:'查询改写',vector_done:'向量语义检索',bm25_done:'BM25 关键词检索',fusion_done:'自适应 RRF 融合',rerank_done:'级联重排序',rerank_skip:'重排序',generate_start:'LLM 生成',generate_done:'生成完成',done:'流水线完成'};
var steps=[];
var ANSWER_HEADER='<h3 style="font-size:12px;color:var(--green);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">' + String.fromCodePoint(0x1F4AC) + ' 生成结果<button id="copyBtn" onclick="copyAnswer()" style="padding:3px 10px;font-size:10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer">📋 复制</button></h3><div class="stream"></div><span class="cursor" id="cur"></span>';

async function R(){
  var q=document.getElementById('qi').value.trim();if(!q||streaming)return;
  streaming=true;stopped=false;steps=[];document.getElementById('qb').disabled=true;
  document.getElementById('qstop').classList.add('show');
  var oe=document.getElementById('err');if(oe)oe.remove();
  document.getElementById('answer').innerHTML='';document.getElementById('stats').innerHTML='';
  document.getElementById('tl').innerHTML='';
  try{
    var tid = new URLSearchParams(window.location.search).get('tid') || '';
    var r=await fetch(A+'/ask/trace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q, topic_id:tid})});
    if(!r.ok||!r.body){throw new Error('HTTP '+r.status)}
    var reader=r.body.getReader(),decoder=new TextDecoder(),buf='';
    currentReader=reader;
    while(true){
      var v=await reader.read();if(v.done)break;
      buf+=decoder.decode(v.value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop()||'';
      for(var i=0;i<lines.length;i++){
        var l=lines[i];if(l.indexOf('data: ')===0){
          try{var d=JSON.parse(l.slice(6));H(d)}catch(e){}
        }
      }
    }
  }catch(e){
    if(!stopped)showErr('连接失败: '+(e.message||'网络错误')+'，请重试');
  }
  streaming=false;currentReader=null;document.getElementById('qb').disabled=false;
  document.getElementById('qstop').classList.remove('show');
}
function showErr(msg){
  document.getElementById('answer').innerHTML='<div class="err-msg">⚠️ '+msg+'</div>';
}
function ST(){
  stopped=true;streaming=false;
  if(currentReader){try{currentReader.cancel()}catch(e){}}
  document.getElementById('qb').disabled=false;
  document.getElementById('qstop').classList.remove('show');
  var a=document.getElementById('answer'),s=a.querySelector('.stream');
  if(s)s.insertAdjacentText('beforeend','\n\n⏹ 已停止');
  var cur=document.getElementById('cur');if(cur)cur.remove();
}
function copyAnswer(){
  var s=document.querySelector('#answer .stream');if(!s)return;
  var t=s.textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(t)}
  else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  var b=document.getElementById('copyBtn');if(b){b.textContent='✅ 已复制';setTimeout(function(){b.textContent='📋 复制'},1500)}
}

function H(d){
  if(d.error){showErr(d.error);return}
  if(d.token){
    var a=document.getElementById('answer');
    if(!a.querySelector('.stream'))a.innerHTML=ANSWER_HEADER;
    var cur=document.getElementById('cur');
    if(cur)cur.insertAdjacentText('beforebegin',d.token);
    return;
  }
  if(d.step==='done'){renderStats();return}
  if(d.step==='generate_start'){document.getElementById('answer').innerHTML=ANSWER_HEADER}
  U(d.step,d);
}

function U(step,data){
  var cat=step.split('_')[0],name=NAMES[step]||step;
  var idx=-1;
  for(var i=0;i<steps.length;i++){if(steps[i].step===step){idx=i;break}}
  if(idx>=0){steps[idx]={step:step,data:data,name:name,cat:cat};}else{steps.push({step:step,data:data,name:name,cat:cat,ts:Date.now()});}
  for(var j=0;j<steps.length;j++){if(steps[j].step!==step&&steps[j].step!=='generate_start'&&steps[j].step!=='done')steps[j].done=true;}

  var h='',activeFound=false;
  for(var k=0;k<steps.length;k++){
    var s=steps[k],cls=s.step===step&&!activeFound?'active':(s.done?'done':'');
    if(s.step===step&&!activeFound)activeFound=true;
    h+='<div class="step '+cls+'"><div class="step-header"><span class="step-icon">'+(ICONS[s.step]||'')+'</span><span class="step-name">'+s.name+'</span><span class="step-time">'+((s.data||{}).elapsed||'')+'</span></div>';
    if(s.data){
      var dt='';
      if(s.step==='rewrite_done'&&s.data.changed)dt='<b>'+s.data.original+'</b> → <b>'+s.data.expanded+'</b>';
      else if(s.step==='vector_done'){dt='检索到 <b>'+s.data.results+'</b> 个候选 · 最高相似度 <b>'+s.data.top_score+'</b>';if(s.data.top_titles&&s.data.top_titles.length){dt+='<div style="margin-top:4px;font-size:10px;color:var(--muted)">Top: '+s.data.top_titles.map(function(t,i){return (i+1)+'. '+t}).join(' | ')+'</div>'}}
      else if(s.step==='bm25_done'){dt='关键词命中 <b>'+s.data.results+'</b> 篇';if(s.data.top_titles&&s.data.top_titles.length){dt+='<div style="margin-top:4px;font-size:10px;color:var(--muted)">Top: '+s.data.top_titles.map(function(t,i){return (i+1)+'. '+t}).join(' | ')+'</div>'}}
      else if(s.step==='fusion_done')dt='<span class="badge '+(s.data.alpha_bm25>.6?'amber':'blue')+'">BM25: '+s.data.alpha_bm25+'</span> <span class="badge '+(s.data.alpha_bm25>.6?'blue':'amber')+'">向量: '+((s.data.alpha_vector)||(1-s.data.alpha_bm25).toFixed(3))+'</span> '+s.data.strategy;
      else if(s.step==='rerank_done'){dt='<b>'+s.data.before+'</b> → <b>'+s.data.after+'</b> 精排';if(s.data.top_titles&&s.data.top_titles.length){dt+='<div style="margin-top:4px;font-size:10px;color:var(--green)">Reranked: '+s.data.top_titles.map(function(t,i){return (i+1)+'. '+t}).join(' | ')+'</div>'}}
      else if(s.step==='generate_start')dt='已有 <b>'+((s.data||{}).elapsed||'?')+'</b> 耗时，开始生成';
      else if(s.step==='generate_done')dt='生成 <b>'+s.data.tokens+'</b> tokens · 总计 <b>'+s.data.total+'</b>';
      h+='<div class="step-detail">'+dt+'</div>';
    }
    h+='</div>';
  }
  document.getElementById('tl').innerHTML=h;
}

function renderStats(){
  var h='';
  var g=steps.find(function(s){return s.step==='generate_done'});
  if(g&&g.data){
    h+='<div class="stat-card"><div class="v">'+g.data.total+'</div><div class="l">总耗时</div></div>';
    h+='<div class="stat-card"><div class="v">'+g.data.tokens+'</div><div class="l">生成 Tokens</div></div>';
    var v=steps.find(function(s){return s.step==='vector_done'});
    if(v)h+='<div class="stat-card"><div class="v">'+(v.data.top_score*100).toFixed(0)+'%</div><div class="l">向量相似度</div></div>';
    var f=steps.find(function(s){return s.step==='fusion_done'});
    if(f)h+='<div class="stat-card"><div class="v">'+f.data.fused_count+'</div><div class="l">融合结果</div></div>';
  }
  document.getElementById('stats').innerHTML=h;
}
// Auto-start if question provided via URL params
(function init(){
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q) { document.getElementById('qi').value = q; setTimeout(R, 300) }
})();
</script>
</body>
</html>
